name: MLOps CI/CD Pipeline

on:
  push:
    branches: [ main ]
    paths:
      - 'dags/**'
      - 'notebooks/**'
      - 'serving/**'
      - 'scripts/**'
      - 'workflows/**'
      - 'sql/**'
      - 'requirements.txt'
      - 'ecosystem.config.js'
  workflow_dispatch: # Mengizinkan trigger manual via tombol "Run workflow" di GitHub UI

jobs:
  deploy:
    name: Deploy to Remote Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup SSH & Known Hosts
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          SSH_PORT="${{ secrets.SSH_PORT || '22' }}"
          if [ -n "${{ secrets.SSH_KNOWN_HOSTS }}" ]; then
            echo "${{ secrets.SSH_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts
          else
            ssh-keyscan -p "$SSH_PORT" -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
          fi
          chmod 644 ~/.ssh/known_hosts

      - name: Execute Remote Deployment via SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          APP_DIR: ${{ secrets.APP_DIR }}
          GIT_SHA: ${{ github.sha }}
          GIT_REF: ${{ github.ref_name }}
        run: |
          ssh -p "$SSH_PORT" -i ~/.ssh/id_rsa "$SSH_USER@$SSH_HOST" \
            "GIT_REF='$GIT_REF' GIT_SHA='$GIT_SHA' bash $APP_DIR/workflows/deploy_remote.sh"
