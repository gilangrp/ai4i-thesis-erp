yle.width = Math.min(100, ratio*100) + \"%\";\n}\n\ndocument.querySelectorAll(\"[data-p]\").forEach(b => b.onclick = () => fill(PRESETS[b.dataset.p]));\n$(\"run\").onclick = run;\nfill(PRESETS.overstrain);\n\u003c/script>\n\u003c/body>\n\u003c/html>\n"}, {"path": "ui/pipeline_monitor.html", "size": 7484, "lines": 121, "kind": "text", "desc": "Contoh tampilan status pipeline dan model registry.", "content": "\u003c!DOCTYPE html>\n\u003chtml lang=\"id\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\u003ctitle>Monitor pipeline dan model (dummy)\u003c/title>\n\u003clink rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n\u003clink href=\"https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&family=JetBrains+Mono:wght@400;600&display=swap\" rel=\"stylesheet\">\n\u003cstyle>\n:root{--bg:#eef1ee;--panel:#fff;--ink:#16262b;--muted:#5b6b70;--line:#cbd4d1;--track:#dde4e1;--ok:#1f7a5a;--fail:#c2410c;--b:#6b7f86;\n  --sans:\"Archivo\",system-ui,-apple-system,\"Segoe UI\",sans-serif;--mono:\"JetBrains Mono\",ui-monospace,Menlo,Consolas,monospace;color-scheme:light}\n@media (prefers-color-scheme:dark){:root{--bg:#111a1d;--panel:#182327;--ink:#e6eeeb;--muted:#9aaba9;--line:#2b3a3e;--track:#263337;--ok:#4dbf96;--fail:#f08a5d;--b:#8fa3aa;color-scheme:dark}}\n*{box-sizing:border-box}\nbody{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--sans)}\n.wrap{max-width:1080px;margin:0 auto;padding:24px 20px 44px}\nheader{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:10px;border-bottom:2px solid var(--ink);padding-bottom:12px}\nh1{margin:0;font-size:26px;font-weight:800;letter-spacing:-.01em}\nh2{margin:0 0 12px;font-size:16px;font-weight:600}\n.mono{font:400 12px/1.5 var(--mono);color:var(--muted)} .mono b{color:var(--ink);font-weight:600}\n.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:18px;margin-top:20px}\n.cols{display:grid;grid-template-columns:1fr 1fr;gap:20px}\n@media (max-width:820px){.cols{grid-template-columns:1fr}}\n.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,1fr);gap:10px}\n@media (max-width:820px){.steps{grid-template-columns:repeat(2,1fr)}}\n.steps li{border:1px solid var(--line);border-top:4px solid var(--ok);border-radius:4px;padding:8px 10px;font-size:13px}\n.steps li.fail{border-top-color:var(--fail)} .steps li.skip{border-top-color:var(--track);color:var(--muted)}\n.steps small{display:block;font:400 12px var(--mono);color:var(--muted)}\n.table-scroll{overflow-x:auto}\ntable{width:100%;border-collapse:collapse;font-size:14px}\nth{text-align:left;font-weight:600;color:var(--muted);padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}\ntd{padding:8px;border-bottom:1px solid var(--line);font:400 13px var(--mono);white-space:nowrap}\n.ok{color:var(--ok);font-weight:600}.bad{color:var(--fail);font-weight:600}\n.tag{display:inline-block;padding:1px 8px;border:1px solid var(--ok);color:var(--ok);border-radius:10px;font:600 11px var(--sans)}\n.cmp{display:grid;grid-template-columns:110px 1fr 44px;gap:6px 10px;align-items:center;font-size:13px}\n.cmp .t{position:relative;height:9px;background:var(--track);border-radius:2px}\n.cmp .t i{position:absolute;left:0;top:0;bottom:0;border-radius:2px;background:var(--b)}\n.cmp .t.s i{background:var(--ok)}\n.cmp span.v{font:400 12px var(--mono);text-align:right}\n.legend{display:flex;gap:16px;font-size:12px;color:var(--muted);margin-bottom:10px}\n.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}\ndl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:14px}\ndt{color:var(--muted)} dd{margin:0;font-family:var(--mono);font-size:13px}\n.note{margin-top:16px;font-size:12px;color:var(--muted)}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv class=\"wrap\">\n  \u003cheader>\n    \u003ch1>Monitor pipeline dan model\u003c/h1>\n    \u003cdiv class=\"mono\">run terakhir \u003cb>sukses\u003c/b>, commit \u003cb>a3f9c1e\u003c/b>, 19 Okt 2026 10:42\u003c/div>\n  \u003c/header>\n\n  \u003csection class=\"panel\">\n    \u003ch2>Run terakhir (GitHub Actions)\u003c/h2>\n    \u003col class=\"steps\">\n      \u003cli>Siapkan SSH\u003csmall>2 dtk\u003c/small>\u003c/li>\n      \u003cli>Update kode\u003csmall>4 dtk\u003c/small>\u003c/li>\n      \u003cli>Install dependency\u003csmall>38 dtk\u003c/small>\u003c/li>\n      \u003cli>Sync DAG\u003csmall>1 dtk\u003c/small>\u003c/li>\n      \u003cli>Trigger DAG\u003csmall>1 mnt 12 dtk\u003c/small>\u003c/li>\n      \u003cli>Jalankan notebook\u003csmall>3 mnt 41 dtk\u003c/small>\u003c/li>\n      \u003cli>Reload FastAPI\u003csmall>6 dtk\u003c/small>\u003c/li>\n      \u003cli>Cek kesehatan API\u003csmall>4 dtk\u003c/small>\u003c/li>\n    \u003c/ol>\n  \u003c/section>\n\n  \u003cdiv class=\"cols\">\n    \u003csection class=\"panel\">\n      \u003ch2>Model registry: machine_failure_xgb\u003c/h2>\n      \u003cdiv class=\"table-scroll\">\u003ctable>\n        \u003cthead>\u003ctr>\u003cth>Versi\u003c/th>\u003cth>Varian\u003c/th>\u003cth>val F1\u003c/th>\u003cth>test PR-AUC\u003c/th>\u003cth>Threshold\u003c/th>\u003cth>Alias\u003c/th>\u003c/tr>\u003c/thead>\n        \u003ctbody>\n          \u003ctr>\u003ctd>7\u003c/td>\u003ctd>baseline\u003c/td>\u003ctd>0,816\u003c/td>\u003ctd>0,726\u003c/td>\u003ctd>0,578\u003c/td>\u003ctd>\u003cspan class=\"tag\">champion\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>6\u003c/td>\u003ctd>smote\u003c/td>\u003ctd>0,796\u003c/td>\u003ctd>0,877\u003c/td>\u003ctd>0,857\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>5\u003c/td>\u003ctd>baseline\u003c/td>\u003ctd>0,801\u003c/td>\u003ctd>0,712\u003c/td>\u003ctd>0,590\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\n        \u003c/tbody>\n      \u003c/table>\u003c/div>\n      \u003cp class=\"note\">Champion dipi i style=\"width:87.7%\">\u003c/i>\u003c/div>\u003c/div>\u003cspan class=\"v\">0,73\u003cbr>0,88\u003c/span>\n    \u003c/div>\n    \u003cp class=\"note\">Angka dari eksekusi awal notebook (68 kasus failure di test set). Selisih sekecil itu masih bisa dalam batas noise.\u003c/p>\n  \u003c/section>\n\n  \u003csection class=\"panel\">\n    \u003ch2>Riwayat run\u003c/h2>\n    \u003cdiv class=\"table-scroll\">\u003ctable>\n      \u003cthead>\u003ctr>\u003cth>Waktu\u003c/th>\u003cth>Commit\u003c/th>\u003cth>Pemicu\u003c/th>\u003cth>Langkah akhir\u003c/th>\u003cth>Durasi\u003c/th>\u003cth>Hasil\u003c/th>\u003c/tr>\u003c/thead>\n      \u003ctbody>\n        \u003ctr>\u003ctd>19 Okt 10:42\u003c/td>\u003ctd>a3f9c1e\u003c/td>\u003ctd>push main\u003c/td>\u003ctd>Cek kesehatan API\u003c/td>\u003ctd>5 mnt 48 dtk\u003c/td>\u003ctd class=\"ok\">Sukses\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>18 Okt 16:05\u003c/td>\u003ctd>7be20d4\u003c/td>\u003ctd>push main\u003c/td>\u003ctd>Trigger DAG\u003c/td>\u003ctd>2 mnt 31 dtk\u003c/td>\u003ctd class=\"bad\">Gagal: validasi jumlah baris\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>18 Okt 09:20\u003c/td>\u003ctd>7be20d4\u003c/td>\u003ctd>manual\u003c/td>\u003ctd>Cek kesehatan API\u003c/td>\u003ctd>5 mnt 52 dtk\u003c/td>\u003ctd class=\"ok\">Sukses\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>16 Okt 14:11\u003c/td>\u003ctd>c01a9b8\u003c/td>\u003ctd>push main\u003c/td>\u003ctd>Cek kesehatan API\u003c/td>\u003ctd>5 mnt 40 dtk\u003c/td>\u003ctd class=\"ok\">Sukses\u003c/td>\u003c/tr>\n      \u003c/tbody>\n    \u003c/table>\u003c/div>\n    \u003cp class=\"note\">Tampilan contoh. Data di halaman ini hanya ilustrasi, belum terhubung ke GitHub, Airflow, atau MLflow.\u003c/p>\n  \u003c/section>\n\u003c/div>\n\u003c/body>\n\u003c/html>\n"}];
const $ = id => document.getElementById(id);
const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const kb = n => n < 1024 ? n + " B" : (n/1024).toFixed(1).replace(".", ",") + " KB";

const root = {};
FILES.forEach((f, i) => {
  let n = root; const parts = f.path.split("/");
  parts.forEach((p, k) => { if (k === parts.length-1) (n.__f = n.__f || []).push({name:p, i}); else n = (n[p] = n[p] || {}); });
});
function render(node){
  const dirs = Object.keys(node).filter(k => k !== "__f").sort();
  let h = dirs.map(d => `<details open><summary>${esc(d)}/</summary><div>${render(node[d])}</div></details>`).join("");
  h += (node.__f || []).sort((a,b) => a.name.localeCompare(b.name))
        .map(f => `<button class="file" data-i="${f.i}" data-n="${esc(FILES[f.i].path.toLowerCase())}">${esc(f.name)}</button>`).join("");
  return h;
}
$("tree").innerHTML = render(root);

const totalLines = FILES.filter(f => f.kind === "text").reduce((a,f) => a + f.lines, 0);
$("stats").textContent = FILES.length + " file, " + new Intl.NumberFormat("id-ID").format(totalLines) + " baris kode dan teks";

let current = null;
function show(i){
  const f = FILES[i]; current = f;
  document.querySelectorAll(".file").forEach(b => b.setAttribute("aria-current", b.dataset.i == i ? "true" : "false"));
  let body;
  if (f.kind === "data") body = `<div class="empty">File data (${new Intl.NumberFormat("id-ID").format(f.lines)} baris). Isinya tidak ditampilkan di halaman ini.</div>`;
  else if (f.kind === "empty") body = `<div class="empty">File kosong.</div>`;
  else body = "<pre><code>" + f.content.replace(/\n$/, "").split("\n").map(l => `<span class="l">${esc(l) || " "}</span>`).join("") + "</code></pre>";
  $("view").innerHTML = `<div class="vhead"><h2>${esc(f.path)}</h2><p>${esc(f.desc)}</p>
    <div class="meta"><span>${kb(f.size)}</span><span>${f.lines} baris</span>${f.kind === "text" ? '<button id="copy" type="button">Salin isi</button>' : ""}</div></div>${body}`;
  const c = $("copy");
  if (c) c.onclick = async () => { try { await navigator.clipboard.writeText(current.content); c.textContent = "Tersalin"; }
                                   catch(e) { c.textContent = "Tidak bisa menyalin"; } setTimeout(() => c.textContent = "Salin isi", 1500); };
}
document.querySelectorAll(".file").forEach(b => b.onclick = () => show(+b.dataset.i));

$("q").oninput = e => {
  const q = e.target.value.trim().toLowerCase();
  document.querySelectorAll(".file").forEach(b => b.hidden = q && !b.dataset.n.includes(q));
  document.querySelectorAll("details").forEach(d => d.hidden = q && !d.querySelector(".file:not([hidden])"));
};
const start = FILES.findIndex(f => f.path === "README.md");
show(start >= 0 ? start : 0);
</script>
