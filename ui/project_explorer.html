const FILES = [{"path": ".env.example", "size": 1302, "lines": 37, "kind": "text", "desc": "Template konfigurasi server. Salin menjadi .env, jangan di-commit.", "content": "# Salin ke .env di server (JANGAN di-commit). Dibaca deploy_remote.sh, notebook, dan app.py.\n\n# --- Airflow (dipakai scripts/trigger_airflow_dag.py) ---\nAIRFLOW_BASE_URL=http://localhost:8080\nAIRFLOW_API_VERSION=v2            # v2 = Airflow 3.x (JWT), v1 = Airflow 2.x (basic auth)\nAIRFLOW_USERNAME=admin\nAIRFLOW_PASSWORD=ganti-ini\nAIRFLOW_DAG_ID=oracle_to_clickhouse_ai4i\nAIRFLOW_DAGS_DIR=/opt/airflow/dags\n\n# --- ClickHouse (dibaca notebook) ---\nDATA_SOURCE=clickhouse            # clickhouse | csv\nCH_HOST=localhost\nCH_PORT=8123\nCH_USER=default\nCH_PASSWORD=\nCH_DATABASE=default\nCH_TABLE=ai4i_2020\n\n# --- MLflow ---\nMLFLOW_TRACKING_URI=http://127.0.0.1:5000\nMLFLOW_EXPERIMENT=machine-failure-ai4i2020\nMLFLOW_MODEL_NAME=machine_failure_xgb\nMLFLOW_MODEL_ALIAS=champion\nMODEL_TO_REGISTER=auto            # auto (pilih val_f1 tertinggi) | baseline | smote\n# MLFLOW_TRACKING_USERNAME=\n# MLFLOW_TRACKING_PASSWORD=\n\n# --- FastAPI / pm2 ---\nAPI_HOST=0.0.0.0\nAPI_PORT=8000\nUVICORN_WORKERS=1\nADMIN_API_KEY=isi-string-acak-panjang   # untuk POST /reload\nCORS_ORIGINS=                            # mis. https://ui.perusahaan.com (kosong = nonaktif)\n\n# Catatan: ORACLE_SOURCE_TABLE dan CH_TABLE yang dibaca DAG diset di environment Airflow,\n# bukan di file ini (kecuali Airflow dijalankan dengan .env yang sama).\n"}, {"path": ".github/workflows/mlops-pipeline.yml", "size": 1946, "lines": 57, "kind": "text", "desc": "CI/CD: SSH ke server, trigger DAG, jalankan notebook, reload API.", "content": "name: MLOps pipeline (SSH > DAG > notebook > FastAPI)\n\non:\n  push:\n    branches: [main]\n    paths:\n      - \"dags/**\"\n      - \"notebooks/**\"\n      - \"serving/**\"\n      - \"scripts/**\"\n      - \"requirements.txt\"\n      - \"ecosystem.config.js\"\n      - \".github/workflows/**\"\n  workflow_dispatch:\n\n# satu pipeline pada satu waktu; run berikutnya antre, tidak membatalkan yang sedang jalan\nconcurrency:\n  group: mlops-pipeline\n  cancel-in-progress: false\n\njobs:\n  deploy:\n    if: github.ref == 'refs/heads/main'\n    runs-on: ubuntu-latest\n    timeout-minutes: 120\n    env:\n      SSH_HOST: ${{ secrets.SSH_HOST }}\n      SSH_USER: ${{ secrets.SSH_USER }}\n      SSH_PORT: ${{ secrets.SSH_PORT }}\n      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}\n      SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}\n      APP_DIR: ${{ secrets.APP_DIR }}\n    steps:\n      - name: Siapkan kredensial SSH\n        run: |\n          install -m 700 -d ~/.ssh\n          printf '%s\\n' \"$SSH_PRIVATE_KEY\" > ~/.ssh/id_deploy\n          chmod 600 ~/.ssh/id_deploy\n          if [ -n \"$SSH_KNOWN_HOSTS\" ]; then\n            printf '%s\\n' \"$SSH_KNOWN_HOSTS\" > ~/.ssh/known_hosts\n          else\n            ssh-keyscan -p \"${SSH_PORT:-22}\" -H \"$SSH_HOST\" >> ~/.ssh/known_hosts\n          fi\n\n      - name: Jalankan pipeline di server\n        # Di server: git update > pip install > copy DAG > trigger DAG via API (tunggu sukses)\n        #            > papermill notebook (log ke MLflow) > pm2 reload FastAPI > health check\n        run: |\n          ssh -i ~/.ssh/id_deploy -p \"${SSH_PORT:-22}\" \\\n              -o ServerAliveInterval=30 -o ServerAliveCountMax=40 \\\n              \"$SSH_USER@$SSH_HOST\" \\\n              \"set -e; cd '$APP_DIR'; git fetch --prune origin; git reset --hard '$GITHUB_SHA'; \\\n               GIT_REF='$GITHUB_REF_NAME' GIT_SHA='$GITHUB_SHA' bash scripts/deploy_remote.sh\"\n\n      - name: Bersihkan kredensial\n        if: always()\n        run: rm -f ~/.ssh/id_deploy\n"}, {"path": ".gitignore", "size": 95, "lines": 8, "kind": "text", "desc": "Daftar file yang tidak ikut git.", "content": ".env\n.venv/\n__pycache__/\n*.pyc\nmlruns/\nruns/executed_*.ipynb\n.ipynb_checkpoints/\nnode_modules/\n"}, {"path": "README.md", "size": 9371, "lines": 163, "kind": "text", "desc": "Panduan setup, alur pipeline, endpoint API, dan daftar GitHub secrets.", "content": "# Machine Failure MLOps (AI4I 2020)\n\nPipeline dari data mentah sampai model yang dilayani lewat API:\n\n```\nCSV ──(1) csv_to_oracle_insert.py──> file .sql ──(manual)──> Oracle 26ai\n                                                                │\n                                          (2) DAG Airflow oracle_to_clickhouse_ai4i\n                                                                ▼\n                                                           ClickHouse\n                                                                │\n                                          (3) notebook (papermill) train + log\n                                                                ▼\n                                            MLflow Tracking + Model Registry\n                                                  alias: machine_failure_xgb@champion\n                                                                │\n                                          (4) FastAPI (uvicorn + pm2) memuat dari registry\n                                                                ▼\n                                                    POST /predict  ──> UI\n```\n\nTrigger otomatis: push ke `main` -> GitHub Actions SSH ke server -> `scripts/deploy_remote.sh`.\n\n## Struktur folder\n\n```\nmachine-failure-mlops/\n├── .github/workflows/mlops-pipeline.yml   # CI/CD: SSH > DAG > notebook > reload API\n├── dags/\n│   ├── oracle_to_clickhouse_ai4i.py       # DAG Airflow (Oracle 26ai -> ClickHouse)\n│   └── requirements-airflow.txt           # dependensi untuk env Airflow\n├── data/ai4i2020.csv                      # data sumber\n├── notebooks/\n│   └── SMOTE_ai4i2020_xgboost_machine_failure.ipynb   # training + log ke MLflow\n├── scripts/\n│   ├── build_explorer.py                  # bangun ui/project_explorer.html\n│   ├── csv_to_oracle_insert.py            # CSV -> INSERT INTO Oracle\n│   ├── trigger_airflow_dag.py             # trigger + tunggu DAG via REST API\n│   └── deploy_remote.sh                   # dijalankan di server oleh workflow\n├── serving/app.py                         # FastAPI, model dari MLflow Registry\n├── sql/insert_ai4i2020.sql                # hasil generate (tabel AI4I_2020)\n├── ui/\n│   ├── dummy_dashboard.html               # contoh form prediksi\n│   ├── pipeline_monitor.html              # contoh status pipeline + model registry\n│   └── project_explorer.html              # daftar file project + isinya\n├── runs/                                  # hasil eksekusi notebook (papermill)\n├── ecosystem.config.js                    # konfigurasi pm2\n├── requirements.txt\n└── .env.example\n```\n\n## 1. CSV ke script INSERT Oracle\n\n```bash\npython scripts/csv_to_oracle_insert.py \\\n  --csv data/ai4i2020.csv --out sql/insert_ai4i2020.sql \\\n  --table AI4I_2020 [--schema NAMA_SCHEMA] [--batch-size 500] [--style multirow|single]\n```\n\n- `multirow` (default): `INSERT INTO t (...) VALUES (...),(...);` per 500 baris, sintaks Oracle 23ai/26ai. Maksimal 1000 baris per statement.\n- `single`: satu INSERT per baris, untuk kompatibilitas.\n- Kolom (sesuai urutan CSV): `UDI, PRODUCT_ID, TYPE, AIR_TEMP_K, PROCESS_TEMP_K, RPM, TORQUE_NM, TOOL_WEAR_MIN, MACHINE_FAILURE, TWF, HDF, PWF, OSF, RNF`. Kalau skema Anda memakai nama lain, ubah daftar `COLUMNS` di bagian atas script.\n- `sql/insert_ai4i2020.sql` sudah dibuat dari CSV yang dilampirkan (10.000 baris, tanpa `CREATE TABLE`). Hanya berisi INSERT dan `COMMIT`.\n\n## 2. DAG Airflow (Oracle ke ClickHouse)\n\n`oracle_to_clickhouse_ai4i`: `create_clickhouse_table` > `extract_and_load` > `validate`. Tanpa jadwal, hanya dipicu lewat API. Full refresh: tabel ClickHouse di-`TRUNCATE` lalu diisi ulang, lalu jumlah baris dan jumlah failure dibandingkan dengan Oracle.\n\nYang perlu disiapkan di Airflow:\n\n| Item | Nilai |\n|---|---|\n| Connection `oracle_ai4i` | Host, Port 1521, Login, Password, Extra `{\"service_name\": \"...\"}` |\n| Connection `clickhouse_ai4i` | Host, Port 8123 (HTTP), Login, Password, **Schema = nama database** |\n| Env `ORACLE_SOURCE_TABLE` | default `AI4I_2020`, boleh `SCHEMA.TABEL` |\n| Env `CH_TABLE` | default `ai4i_2020` |\n| Paket | `pip install -r dags/requirements-airflow.txt` |\n\nDAG ditulis kompatibel Airflow 2.x dan 3.x. Nama kolom di Oracle harus sama dengan daftar di atas (query memakai kolom eksplisit).\n\n## 3. Notebook ke MLflow\n\nNotebook membaca ClickHouse (`DATA_SOURCE=clickhouse`; `csv` untuk eksperimen lokal), melatih baseline dan SMOTE, lalu:\n\n- mencatat dua run (param, metrik val + test, confusion matrix, feature importance, model + signature),\n- memilih champion (`MODEL_TO_REGISTER=auto` = **F1 validation** tertinggi, bukan test set),\n- mendaftarkan ke registry dan memberi alias `champion`. Threshold, fitur, dan type_map disimpan sebagai **tag model version**.\n\nSemua konfigurasi lewat environment variable (lihat `.env.example`). Jalankan manual:\n\n```bash\nset -a; source .env; set +a\npapermill notebooks/SMOTE_ai4i2020_xgboost_machine_failure.ipynb runs/out.ipynb --cwd notebooks\n```\n\n## 4. FastAPI\n\n```bash\ncd serving && uvicorn app:app --reload --port 8000     # dev\npm2 start ecosystem.config.js                          # produksi\n```\n\n| Endpoint | Fungsi |\n|---|---|\n| `GET /health` | status + `model_loaded` |\n| `GET /model-info` | nama, versi, threshold, fitur, run_id MLflow |\n| `POST /predict` | satu pembacaan sensor |\n| `POST /predict/batch` | `{\"items\": [...]}`, maks 1000 |\n| `POST /reload` | muat ulang dari MLflow tanpa restart, header `X-API-Key: $ADMIN_API_KEY` |\n\n```bash\ncurl -s localhost:8000/predict -H 'Content-Type: application/json' -d '{\n  \"type\":\"L\",\"air_temp_k\":300.5,\"process_temp_k\":310.9,\n  \"rpm\":1500,\"torque_nm\":55.0,\"tool_wear_min\":215}'\n```\n\nDocs interaktif: `http://localhost:8000/docs`. Model dimuat dari `models:/\u003cMLFLOW_MODEL_NAME>@\u003cMLFLOW_MODEL_ALIAS>`, tidak ada file model di server. Kalau MLflow tidak terjangkau saat start, API tetap hidup dengan `model_loaded:false` dan `/predict` mengembalikan 503.\n\n## 5. CI/CD (GitHub Actions)\n\nFile: `.github/workflows/mlops-pipeline.yml`. Jalan saat push ke `main` yang mengubah `dags/`, `notebooks/`, `serving/`, `scripts/`, `requirements.txt`, atau `ecosystem.config.js` (atau manual lewat *Run workflow*).\n\nUrutan di server (`scripts/deploy_remote.sh`): update git > install dependency > copy DAG ke `AIRFLOW_DAGS_DIR` > trigger DAG via API dan tunggu sukses > jalankan notebook dengan papermill > `pm2 startOrReload` > cek `/health` memastikan model termuat. Kalau salah satu langkah gagal, workflow merah dan langkah berikutnya tidak jalan (API lama tetap melayani model lama).\n\n**GitHub Secrets** (Settings > Secrets and variables > Actions):\n\n| Secret | Isi |\n|---|---|\n| `SSH_HOST`, `SSH_USER` | tujuan SSH |\n| `SSH_PORT` | opsional, default 22 |\n| `SSH_PRIVATE_KEY` | private key khusus deploy |\n| `SSH_KNOWN_HOSTS` | disarankan, output `ssh-keyscan -H host` (tanpa ini host key di-scan saat run) |\n| `APP_DIR` | path project di server, mis. `/opt/machine-failure-mlops` |\n\nKredensial Airflow, ClickHouse, dan MLflow **tidak** disimpan di GitHub, tetapi di `.env` pada server.\n\n**Setup server sekali saja:**\n\n```bash\ngit clone \u003crepo> /opt/machine-failure-mlops && cd /opt/machine-failure-mlops\ncp .env.example .env && nano .env\npython3 -m venv .venv && .venv/bin/pip install -r requirements.txt\npm2 startup   # agar API hidup lagi setelah reboot\n```\n\nPrasyarat: server punya akses `git fetch` ke repo (deploy key), `pm2`, `curl`, dan Airflow API aktif (`AIRFLOW_API_VERSION=v2` untuk Airflow 3, `v1` untuk Airflow 2).\n\n## 6. UI\n\n`ui/dummy_dashboard.html` bisa dibuka langsung di browser. Isinya form sensor, gauge probabilitas dengan penanda threshold, tiga indikator fitur turunan, dan riwayat. Angka hasilnya simulasi dari rumus sederhana di JavaScript, belum memanggil API. Field respons `/predict` (`label`, `probability`, `threshold`, `model_version`) sudah sejajar dengan elemen di halaman ini. Kalau nanti dihubungkan, set `CORS_ORIGINS` di `.env`.\n\nDua halaman contoh lain (sama-sama tanpa koneksi):\n\n- `ui/project_explorer.html`: penjelajah file project dengan isi file tertanam. Jalankan `python scripts/build_explorer.py` setiap file project berubah. File `.csv` dan `.sql` hanya tampil metadatanya.\n- `ui/pipeline_monitor.html`: gambaran status run GitHub Actions, model registry (versi, alias champion, threshold), dan perbandingan baseline vs SMOTE. Angka riwayat dan versi adalah ilustrasi.\n\n## Catatan penting\n\n- **Rumus fitur ada di dua tempat** (`make_features` di notebook dan `serving/app.py`). Daftar dan urutan fitur otomatis ikut model lewat tag MLflow, tetapi rumusnya tidak. Ubah keduanya bersamaan.\n- **Baseline berhenti di iterasi 3** pada eksekusi awal (lihat output notebook asli), jadi perbandingan baseline vs SMOTE belum sepenuhnya adil. Kalau champion terpilih terasa janggal, cek dulu early stopping sebelum menyimpulkan.\n- `TRUNCATE` + reload berarti ClickHouse kosong sesaat selama DAG berjalan. Untuk 10.000 baris ini hitungan detik.\n- `/reload` hanya memuat ulang satu proses. Dengan `UVICORN_WORKERS` > 1, gunakan `pm2 reload` agar semua worker ikut.\n- Dataset AI4I bersifat sintetis dengan label dari aturan ambang, jadi skor tinggi belum tentu berlaku di data pabrik nyata.\n"}, {"path": "dags/oracle_to_clickhouse_ai4i.py", "size": 4918, "lines": 127, "kind": "text", "desc": "DAG Airflow: Oracle 26ai ke ClickHouse, full refresh dengan validasi.", "content": "\"\"\"\nDAG: Oracle 26ai -> ClickHouse (dataset AI4I 2020).\n\nDipicu lewat API (schedule=None) oleh GitHub Actions / deploy script.\nFull refresh: tabel ClickHouse dikosongkan lalu diisi ulang dari Oracle,\nkemudian divalidasi (jumlah baris + jumlah failure harus sama).\n\nAirflow Connections yang dibutuhkan (Admin > Connections):\n  oracle_ai4i      Conn Type: Generic | Host | Port 1521 | Login | Password\n                   Extra: {\"service_name\": \"FREEPDB1\"}\n  clickhouse_ai4i  Conn Type: Generic | Host | Port 8123 (HTTP) | Login | Password\n                   Schema: \u003cnama database ClickHouse>   Extra: {\"secure\": false}\n\nEnv (opsional, default di bawah):\n  ORACLE_SOURCE_TABLE   default AI4I_2020   (boleh \"SCHEMA.TABEL\")\n  CH_TABLE              default ai4i_2020\nDependensi di environment Airflow: oracledb, clickhouse-connect\n\"\"\"\nimport json\nimport os\nfrom datetime import datetime, timedelta\n\ntry:  # Airflow 3.x\n    from airflow.sdk import BaseHook, dag, task\nexcept ImportError:  # Airflow 2.x\n    from airflow.decorators import dag, task\n    from airflow.hooks.base import BaseHook\n\nORACLE_CONN_ID = \"oracle_ai4i\"\nCH_CONN_ID = \"clickhouse_ai4i\"\nORACLE_TABLE = os.getenv(\"ORACLE_SOURCE_TABLE\", \"AI4I_2020\")\nCH_TABLE = os.getenv(\"CH_TABLE\", \"ai4i_2020\")\nCHUNK = 5000\n\n# (nama kolom, tipe ClickHouse, fungsi cast Python)\nCOLS = [\n    (\"udi\", \"UInt32\", int), (\"product_id\", \"String\", str),\n    (\"type\", \"LowCardinality(String)\", str),\n    (\"air_temp_k\", \"Float64\", float), (\"process_temp_k\", \"Float64\", float),\n    (\"rpm\", \"UInt32\", int), (\"torque_nm\", \"Float64\", float),\n    (\"tool_wear_min\", \"UInt32\", int), (\"machine_failure\", \"UInt8\", int),\n    (\"twf\", \"UInt8\", int), (\"hdf\", \"UInt8\", int), (\"pwf\", \"UInt8\", int),\n    (\"osf\", \"UInt8\", int), (\"rnf\", \"UInt8\", int),\n]\nCOL_NAMES = [c[0] for c in COLS]\n\n\ndef _oracle_conn():\n    import oracledb  # thin mode, tidak perlu Oracle Client\n    c = BaseHook.get_connection(ORACLE_CONN_ID)\n    extra = json.loads(c.extra) if c.extra else {}\n    service = extra.get(\"service_name\") or c.schema\n    dsn = f\"{c.host}:{c.port or 1521}/{service}\"\n    return oracledb.connect(user=c.login, password=c.password, dsn=dsn)\n\n\ndef _ch_client():\n    import clickhouse_connect\n    c = BaseHook.get_connection(CH_CONN_ID)\n    extra = json.loads(c.extra) if c.extra else {}\n    return clickhouse_connect.get_client(\n        host=c.host, port=int(c.port or 8123), username=c.login or \"default\",\n        password=c.password or \"\", database=c.schema or \"default\",\n        secure=bool(extra.get(\"secure\", False)),\n    )\n\n\n@dag(\n    dag_id=\"oracle_to_clickhouse_ai4i\",\n    description=\"Full refresh dataset AI4I 2020 dari Oracle ke ClickHouse\",\n    schedule=None,\n    start_date=datetime(2026, 1, 1),\n    catchup=False,\n    max_active_runs=1,\n    dagrun_timeout=timedelta(hours=1),\n    default_args={\"retries\": 2, \"retry_delay\": timedelta(minutes=2)},\n    tags=[\"ai4i\", \"oracle\", \"clickhouse\", \"mlops\"],\n)\ndef oracle_to_clickhouse_ai4i():\n\n    @task\n    def create_clickhouse_table() -> None:\n        ddl_cols = \",\\n  \".join(f\"{n} {t}\" for n, t, _ in COLS)\n        ch = _ch_client()\n        ch.command(\n            f\"CREATE TABLE IF NOT EXISTS {CH_TABLE} (\\n  {ddl_cols}\\n) \"\n            f\"ENGINE = MergeTree ORDER BY udi\"\n        )\n\n    @task\n    def extract_and_load() -> int:\n        ch = _ch_client()\n        ch.command(f\"TRUNCATE TABLE {CH_TABLE}\")  # full refresh\n        total = 0\n        with _oracle_conn() as conn:\n            cur = conn.cursor()\n            cur.arraysize = CHUNK\n            cur.execute(f\"SELECT {', '.join(COL_NAMES)} FROM {ORACLE_TABLE} ORDER BY udi\")\n            while True:\n                rows = cur.fetchmany(CHUNK)\n                if not rows:\n                    break\n                data = [[fn(v) if v is not None else None for v, (_, _, fn) in zip(r, COLS)]\n                        for r in rows]\n                ch.insert(CH_TABLE, data, column_names=COL_NAMES)\n                total += len(data)\n        print(f\"Loaded {total} rows into {CH_TABLE}\")\n        return total\n\n    @task\n    def validate(loaded: int) -> None:\n        with _oracle_conn() as conn:\n            cur = conn.cursor()\n            cur.execute(f\"SELECT COUNT(*), NVL(SUM(machine_failure), 0) FROM {ORACLE_TABLE}\")\n            ora_count, ora_fail = (int(x) for x in cur.fetchone())\n        ch_count, ch_fail = _ch_client().query(\n            f\"SELECT count(), sum(machine_failure) FROM {CH_TABLE}\").result_rows[0]\n        print(f\"Oracle: {ora_count} baris / {ora_fail} failure | ClickHouse: {ch_count} / {ch_fail}\")\n        if ora_count == 0:\n            raise ValueError(\"Tabel Oracle kosong, load dibatalkan.\")\n        if (ora_count, ora_fail) != (int(ch_count), int(ch_fail)) or loaded != ora_count:\n            raise ValueError(\"Validasi gagal: data Oracle dan ClickHouse tidak sama.\")\n\n    create_clickhouse_table() >> validate(extract_and_load())\n\n\noracle_to_clickhouse_ai4i()\n"}, {"path": "dags/requirements-airflow.txt", "size": 82, "lines": 3, "kind": "text", "desc": "Dependensi untuk environment Airflow.", "content": "# Pasang di environment Airflow (bukan .venv project)\noracledb\nclickhouse-connect\n"}, {"path": "data/ai4i2020.csv", "size": 522048, "lines": 10001, "kind": "data", "desc": "Data sumber AI4I 2020. Isi tidak ditampilkan di halaman ini.", "content": ""}, {"path": "ecosystem.config.js", "size": 697, "lines": 19, "kind": "text", "desc": "Konfigurasi pm2 untuk menjalankan uvicorn.", "content": "// pm2 start ecosystem.config.js   |   pm2 startOrReload ecosystem.config.js --update-env\nconst path = require(\"path\");\n\nmodule.exports = {\n  apps: [\n    {\n      name: \"ml-failure-api\",\n      // uvicorn dari virtualenv project; interpreter \"none\" = jalankan sebagai binary langsung\n      script: path.join(__dirname, \".venv\", \"bin\", \"uvicorn\"),\n      interpreter: \"none\",\n      args: `app:app --host ${process.env.API_HOST || \"0.0.0.0\"} --port ${process.env.API_PORT || 8000} --workers ${process.env.UVICORN_WORKERS || 1}`,\n      cwd: path.join(__dirname, \"serving\"),\n      autorestart: true,\n      max_restarts: 10,\n      restart_delay: 3000,\n      env: { PYTHONUNBUFFERED: \"1\" },\n    },\n  ],\n};\n"}, {"path": "notebooks/SMOTE_ai4i2020_xgboost_machine_failure.ipynb", "size": 23897, "lines": 409, "kind": "text", "desc": "Training baseline + SMOTE, log ke MLflow, daftar ke Registry. Ditampilkan sebagai teks per sel.", "content": "[sel 1 markdown]\n# # Prediksi Machine Failure dengan XGBoost (AI4I 2020) + MLflow\n# \n# Analogi singkat: model ini seperti teknisi yang dilatih membaca 4 sensor (suhu, putaran, torsi, keausan alat) lalu memutuskan \"mesin ini bakal gagal atau aman?\". Kita juga memberinya 3 \"kalkulator bantu\" (selisih suhu, daya, keausan x torsi) supaya ia tidak perlu menebak rumusnya sendiri.\n# \n# Alur: load data (ClickHouse), feature engineering, split (train/val/test), training baseline + SMOTE, tuning threshold, evaluasi, **kirim ke MLflow (tracking + model registry)**, inference 1 data baru dari registry.\n# \n# Semua konfigurasi dibaca dari environment variable (lihat sel konfigurasi), sehingga notebook yang sama bisa dijalankan manual maupun lewat `papermill` di pipeline CI/CD.\n\n[sel 2 kode]\nimport json\nimport os\nimport numpy as np\nimport pandas as pd\nimport matplotlib.pyplot as plt\n\nimport mlflow\nimport mlflow.xgboost\nfrom mlflow.models import infer_signature\nfrom mlflow.tracking import MlflowClient\n\nfrom sklearn.model_selection import train_test_split\nfrom sklearn.metrics import (classification_report, confusion_matrix,\n                             average_precision_score, roc_auc_score,\n                             precision_score, recall_score, f1_score,\n                             precision_recall_curve, ConfusionMatrixDisplay)\nfrom xgboost import XGBClassifier\n\nRANDOM_STATE = 42\n\n# ---------------- Konfigurasi (override lewat environment variable) ----------------\nDATA_SOURCE = os.getenv(\"DATA_SOURCE\", \"clickhouse\")        # \"clickhouse\" | \"csv\"\nDATA_PATH   = os.getenv(\"DATA_PATH\", \"../data/ai4i2020.csv\") # dipakai bila DATA_SOURCE=csv\n\nCH_HOST     = os.getenv(\"CH_HOST\", \"localhost\")\nCH_PORT     = int(os.getenv(\"CH_PORT\", \"8123\"))             # HTTP port\nCH_USER     = os.getenv(\"CH_USER\", \"default\")\nCH_PASSWORD = os.getenv(\"CH_PASSWORD\", \"\")\nCH_DATABASE = os.getenv(\"CH_DATABASE\", \"default\")\nCH_TABLE    = os.getenv(\"CH_TABLE\", \"ai4i_2020\")\n\nMLFLOW_TRACKING_URI   = os.getenv(\"MLFLOW_TRACKING_URI\", \"http://127.0.0.1:5000\")\nMLFLOW_EXPERIMENT     = os.getenv(\"MLFLOW_EXPERIMENT\", \"machine-failure-ai4i2020\")\nREGISTERED_MODEL_NAME = os.getenv(\"MLFLOW_MODEL_NAME\", \"machine_failure_xgb\")\nMODEL_ALIAS           = os.getenv(\"MLFLOW_MODEL_ALIAS\", \"champion\")\nMODEL_TO_REGISTER     = os.getenv(\"MODEL_TO_REGISTER\", \"auto\")  # auto | baseline | smote\nGIT_SHA               = os.getenv(\"GIT_SHA\", \"local\")\n\n[sel 3 markdown]\n# ## 1. Load data\n# \n# Sumber utama: tabel ClickHouse hasil DAG Airflow (Oracle -> ClickHouse). Untuk eksperimen lokal, set `DATA_SOURCE=csv`.\n\n[sel 4 kode]\nCOLUMNS = [\"udi\", \"product_id\", \"type\", \"air_temp_k\", \"process_temp_k\",\n           \"rpm\", \"torque_nm\", \"tool_wear_min\", \"machine_failure\",\n           \"twf\", \"hdf\", \"pwf\", \"osf\", \"rnf\"]\nINT_COLS   = [\"udi\", \"rpm\", \"tool_wear_min\", \"machine_failure\", \"twf\", \"hdf\", \"pwf\", \"osf\", \"rnf\"]\nFLOAT_COLS = [\"air_temp_k\", \"process_temp_k\", \"torque_nm\"]\n\n\ndef load_from_clickhouse() -> pd.DataFrame:\n    import clickhouse_connect\n    client = clickhouse_connect.get_client(\n        host=CH_HOST, port=CH_PORT, username=CH_USER,\n        password=CH_PASSWORD, database=CH_DATABASE)\n    return client.query_df(f\"SELECT {', '.join(COLUMNS)} FROM {CH_TABLE} ORDER BY udi\")\n\n\ndef load_from_csv() -> pd.DataFrame:\n    # File CSV memakai BOM di awal, jadi pakai utf-8-sig agar nama kolom pertama tidak rusak\n    d = pd.read_csv(DATA_PATH, encoding=\"utf-8-sig\")\n    d.columns = COLUMNS\n    return d\n\n\ndf = load_from_clickhouse() if DATA_SOURCE == \"clickhouse\" else load_from_csv()\ndf = df.astype({**{c: \"int64\" for c in INT_COLS}, **{c: \"float64\" for c in FLOAT_COLS}})\n\nprint(\"Sumber data:\", DATA_SOURCE)\nprint(df.shape)\ndf.head()\n\n[sel 5 kode]\nprint(df.isna().sum().sum(), \"nilai kosong\")\nprint(df[\"machine_failure\"].value_counts())\nprint(f\"Rasio failure: {df['machine_failure'].mean():.2%}\")\n\n[sel 6 markdown]\n# ## 2. Feature engineering\n# \n# Kolom `twf`, `hdf`, `pwf`, `osf`, `rnf` **dibuang** karena itu bocoran label (failure = 1 kalau salah satunya 1). `udi` dan `product_id` hanya identifier.\n# \n# Fitur turunan meniru aturan fisik dari keterangan dataset:\n# - `temp_diff_k`: selisih suhu proses dan udara (aturan HDF)\n# - `power_w`: torsi x rpm x 2pi/60 (aturan PWF)\n# - `wear_torque`: keausan alat x torsi (aturan OSF)\n\n[sel 7 kode]\nTYPE_MAP = {\"L\": 0, \"M\": 1, \"H\": 2}\n\ndef make_features(d: pd.DataFrame) -> pd.DataFrame:\n    out = pd.DataFrame(index=d.index)\n    out[\"type_enc\"]       = d[\"type\"].map(TYPE_MAP)\n    out[\"air_temp_k\"]     = d[\"air_temp_k\"]\n    out[\"process_temp_k\"] = d[\"process_temp_k\"]\n    out[\"rpm\"]            = d[\"rpm\"]\n    out[\"torque_nm\"]      = d[\"torque_nm\"]\n    out[\"tool_wear_min\"]  = d[\"tool_wear_min\"]\n    out[\"temp_diff_k\"]    = d[\"process_temp_k\"] - d[\"air_temp_k\"]\n    out[\"power_w\"]        = d[\"torque_nm\"] * d[\"rpm\"] * 2 * np.pi / 60\n    out[\"wear_torque\"]    = d[\"tool_wear_min\"] * d[\"torque_nm\"]\n    return out\n\nX = make_features(df)\ny = df[\"machine_failure\"]\nFEATURES = list(X.columns)\nX.head()\n\n[sel 8 markdown]\n# ## 3. Split data\n# \n# Stratified supaya proporsi failure sama di tiap bagian. Pembagian: train 64%, validation 16% (untuk early stopping dan tuning threshold), test 20% (hanya disentuh sekali di akhir).\n\n[sel 9 kode]\nX_tmp, X_test, y_tmp, y_test = train_test_split(\n    X, y, test_size=0.20, stratify=y, random_state=RANDOM_STATE)\nX_train, X_val, y_train, y_val = train_test_split(\n    X_tmp, y_tmp, test_size=0.20, stratify=y_tmp, random_state=RANDOM_STATE)\n\nfor name, part in [(\"train\", y_train), (\"val\", y_val), (\"test\", y_test)]:\n    print(f\"{name:5s}: {len(part):5d} baris, failure {part.mean():.2%}\")\n\n[sel 10 markdown]\n# ### 3.1 Penanganan Imbalance dengan SMOTE\n# \n# Karena data failure sangat tidak seimbang (hanya ~3.39%), kita akan menggunakan SMOTE (Synthetic Minority Over-sampling Technique) untuk membuat sampel failure sintetis baru pada **data training saja** agar model tidak bias.\n\n[sel 11 kode]\nfrom imblearn.over_sampling import SMOTE\n\n# Definisikan SMOTE\nsmote = SMOTE(random_state=RANDOM_STATE)\n\n# Fit SMOTE hanya pada training set\nX_train_res, y_train_res = smote.fit_resample(X_train, y_train)\n\nprint(\"Sebelum SMOTE (Train):\", np.bincount(y_train))\nprint(\"Setelah SMOTE (Train):\", np.bincount(y_train_res))\nprint(f\"Rasio failure setelah SMOTE: {y_train_res.mean():.2%}\")\n\n[sel 12 markdown]\n# ## 4. Training XGBoost\n\n[sel 13 kode]\nneg, pos = (y_train == 0).sum(), (y_train == 1).sum()\nscale_pos_weight = neg / pos\nprint(\"scale_pos_weight:\", round(scale_pos_weight, 2))\n\nmodel = XGBClassifier(\n    n_estimators=500,\n    learning_rate=0.05,\n    max_depth=4,\n    subsample=0.8,\n    colsample_bytree=0.8,\n    scale_pos_weight=scale_pos_weight,\n    eval_metric=\"aucpr\",\n    early_stopping_rounds=30,\n    tree_method=\"hist\",\n    random_state=RANDOM_STATE,\n)\n\nmodel.fit(X_train, y_train, eval_set=[(X_val, y_val)], verbose=False)\nprint(\"Best iteration:\", model.best_iteration)\n\n[sel 14 markdown]\n# ### 4.1 Training XGBoost dengan Data Hasil SMOTE\n# \n# Sekarang kita latih XGBoost menggunakan `X_train_res` dan `y_train_res`. Karena data sudah seimbang, kita tidak memerlukan parameter `scale_pos_weight` lagi.\n\n[sel 15 kode]\nmodel_smote = XGBClassifier(\n    n_estimators=500,\n    learning_rate=0.05,\n    max_depth=4,\n    subsample=0.8,\n    colsample_bytree=0.8,\n    eval_metric=\"aucpr\",\n    early_stopping_rounds=30,\n    tree_method=\"hist\",\n    random_state=RANDOM_STATE,\n)\n\n# Latih model dengan data latih hasil resampling SMOTE, validasi tetap menggunakan data val asli\nmodel_smote.fit(X_train_res, y_train_res, eval_set=[(X_val, y_val)], verbose=False)\nprint(\"Best iteration (SMOTE):\", model_smote.best_iteration)\n\n[sel 16 markdown]\n# ### 5.1 Tuning Threshold & Evaluasi Model SMOTE\n\n[sel 17 kode]\nval_proba_smote = model_smote.predict_proba(X_val)[:, 1]\nprec_s, rec_s, thr_s = precision_recall_curve(y_val, val_proba_smote)\nf1_s = 2 * prec_s * rec_s / (prec_s + rec_s + 1e-9)\nbest_s = np.argmax(f1_s[:-1])\nTHRESHOLD_SMOTE = float(thr_s[best_s])\nprint(f\"Threshold terbaik (SMOTE): {THRESHOLD_SMOTE:.3f}  (F1 val = {f1_s[best_s]:.3f})\")\n\ntest_proba_smote = model_smote.predict_proba(X_test)[:, 1]\ntest_pred_smote = (test_proba_smote >= THRESHOLD_SMOTE).astype(int)\n\nprint(\"\\n--- EVALUASI MODEL SMOTE PADA TEST SET ---\")\nprint(classification_report(y_test, test_pred_smote, target_names=[\"Normal\", \"Failure\"], digits=3))\nprint(\"PR-AUC :\", round(average_precision_score(y_test, test_proba_smote), 4))\nprint(\"ROC-AUC:\", round(roc_auc_score(y_test, test_proba_smote), 4))\n\n[sel 18 markdown]\n# ## 5. Tuning threshold\n# \n# Threshold 0,5 jarang ideal untuk data tidak seimbang. Kita cari threshold dengan F1 terbaik di **validation set**, bukan di test set.\n\n[sel 19 kode]\nval_proba = model.predict_proba(X_val)[:, 1]\nprec, rec, thr = precision_recall_curve(y_val, val_proba)\nf1 = 2 * prec * rec / (prec + rec + 1e-9)\nbest = np.argmax(f1[:-1])\nTHRESHOLD = float(thr[best])\nprint(f\"Threshold terbaik: {THRESHOLD:.3f}  (F1 val = {f1[best]:.3f})\")\n\n[sel 20 markdown]\n# ## 6. Evaluasi di test set\n\n[sel 21 kode]\ntest_proba = model.predict_proba(X_test)[:, 1]\ntest_pred = (test_proba >= THRESHOLD).astype(int)\n\nprint(classification_report(y_test, test_pred, target_names=[\"Normal\", \"Failure\"], digits=3))\nprint(\"PR-AUC :\", round(average_precision_score(y_test, test_proba), 4))\nprint(\"ROC-AUC:\", round(roc_auc_score(y_test, test_proba), 4))\n\nConfusionMatrixDisplay(confusion_matrix(y_test, test_pred),\n                       display_labels=[\"Normal\", \"Failure\"]).plot(cmap=\"Blues\")\nplt.title(\"Confusion matrix (test)\")\nplt.show()\n\n[sel 22 markdown]\n# ## 7. Feature importance\n\n[sel 23 kode]\nimp = pd.Series(model.get_booster().get_score(importance_type=\"gain\"))\nimp = imp.reindex(FEATURES).fillna(0).sort_values()\nimp.plot(kind=\"barh\", figsize=(7, 4), title=\"Feature importance (gain)\")\nplt.tight_layout()\nplt.show()\n\n[sel 24 markdown]\n# ## 8. Kirim ke MLflow\n# \n# Kedua model (baseline dan SMOTE) dicatat sebagai run terpisah: parameter, metrik validation + test, plot, dan model itu sendiri (dengan signature). Satu model dipilih sebagai **champion**, didaftarkan ke Model Registry, lalu diberi alias `champion`. FastAPI memuat model lewat alias ini, jadi tidak ada file model yang di-hardcode.\n# \n# Pemilihan otomatis (`MODEL_TO_REGISTER=auto`) memakai **F1 di validation set**, bukan test set, supaya test set tetap bersih. Threshold dan daftar fitur disimpan sebagai tag pada model version agar API memakai konfigurasi yang sama persis dengan training.\n\n[sel 25 kode]\nmlflow.set_tracking_uri(MLFLOW_TRACKING_URI)\nmlflow.set_experiment(MLFLOW_EXPERIMENT)\nclient = MlflowClient()\n\nLOG_PARAM_KEYS = [\"n_estimators\", \"learning_rate\", \"max_depth\", \"subsample\", \"colsample_bytree\",\n                  \"scale_pos_weight\", \"eval_metric\", \"early_stopping_rounds\", \"tree_method\"]\n\n\ndef split_metrics(m, thr):\n    \"\"\"Precision/recall/F1 pada threshold terpilih + PR-AUC/ROC-AUC, untuk val dan test.\"\"\"\n    out = {}\n    for split, (Xs, ys) in {\"val\": (X_val, y_val), \"test\": (X_test, y_test)}.items():\n        proba = m.predict_proba(Xs)[:, 1]\n        pred = (proba >= thr).astype(int)\n        out[f\"{split}_precision\"] = precision_score(ys, pred, zero_division=0)\n        out[f\"{split}_recall\"]    = recall_score(ys, pred, zero_division=0)\n        out[f\"{split}_f1\"]        = f1_score(ys, pred, zero_division=0)\n        out[f\"{split}_pr_auc\"]    = average_precision_score(ys, proba)\n        out[f\"{split}_roc_auc\"]   = roc_auc_score(ys, proba)\n    return {k: float(v) for k, v in out.items()}\n\n\ndef make_plots(m, thr):\n    pred = (m.predict_proba(X_test)[:, 1] >= thr).astype(int)\n    fig_cm, ax = plt.subplots(figsize=(4.5, 4))\n    ConfusionMatrixDisplay(confusion_matrix(y_test, pred),\n                           display_labels=[\"Normal\", \"Failure\"]).plot(cmap=\"Blues\", ax=ax)\n    ax.set_title(\"Confusion matrix (test)\")\n    fig_cm.tight_layout()\n\n    fig_imp, ax2 = plt.subplots(figsize=(7, 4))\n    imp = pd.Series(m.get_booster().get_score(importance_type=\"gain\"))\n    imp.reindex(FEATURES).fillna(0).sort_values().plot(kind=\"barh\", ax=ax2,\n                                                       title=\"Feature importance (gain)\")\n    fig_imp.tight_layout()\n    return fig_cm, fig_imp\n\n\ndef log_variant(variant, m, thr, train_rows, train_failure_ratio):\n    meta = {\"variant\": variant, \"features\": FEATURES, \"type_map\": TYPE_MAP, \"threshold\": thr}\n    with mlflow.start_run(run_name=f\"xgb_{variant}\") as run:\n        mlflow.set_tags({\"variant\": variant, \"data_source\": DATA_SOURCE,\n                         \"git_sha\": GIT_SHA, \"framework\": \"xgboost\"})\n        params = {k: v for k, v in m.get_params().items() if k in LOG_PARAM_KEYS and v is not None}\n        params.update(best_iteration=m.best_iteration, threshold=round(thr, 6),\n                      train_rows=train_rows, train_failure_ratio=round(train_failure_ratio, 4),\n                      n_features=len(FEATURES), random_state=RANDOM_STATE)\n        mlflow.log_params(params)\n\n        metrics = split_metrics(m, thr)\n        mlflow.log_metrics(metrics)\n\n        fig_cm, fig_imp = make_plots(m, thr)\n        mlflow.log_figure(fig_cm, \"plots/confusion_matrix.png\")\n        mlflow.log_figure(fig_imp, \"plots/feature_importance.png\")\n        plt.close(\"all\")\n        mlflow.log_dict(meta, \"meta/model_meta.json\")\n\n        sig_X = X_val.astype(\"float64\")\n        info = mlflow.xgboost.log_model(\n            m, name=\"model\",\n            signature=infer_signature(sig_X, m.predict_proba(X_val)[:, 1]),\n            input_example=sig_X.head(5))\n    return {\"variant\": variant, \"run_id\": run.info.run_id, \"model_uri\": info.model_uri,\n            \"threshold\": thr, \"metrics\": metrics}\n\n\nresults = {\n    \"baseline\": log_variant(\"baseline\", model, THRESHOLD,\n                            len(y_train), float(y_train.mean())),\n    \"smote\":    log_variant(\"smote\", model_smote, THRESHOLD_SMOTE,\n                            len(y_train_res), float(y_train_res.mean())),\n}\n\nsummary = pd.DataFrame({k: v[\"metrics\"] for k, v in results.items()}).T\nsummary[[\"val_f1\", \"val_pr_auc\", \"test_precision\", \"test_recall\", \"test_f1\", \"test_pr_auc\"]].round(4)\n\n[sel 26 kode]\n# Pilih champion lalu daftarkan ke Model Registry\nif MODEL_TO_REGISTER == \"auto\":\n    chosen = max(results, key=lambda k: results[k][\"metrics\"][\"val_f1\"])\nelse:\n    chosen = MODEL_TO_REGISTER\nbest = results[chosen]\nprint(f\"Champion: {chosen} (val_f1={best['metrics']['val_f1']:.3f}, \"\n      f\"test_pr_auc={best['metrics']['test_pr_auc']:.3f}, threshold={best['threshold']:.3f})\")\n\nmv = mlflow.register_model(best[\"model_uri\"], REGISTERED_MODEL_NAME)\ntags = {\n    \"threshold\": f\"{best['threshold']:.6f}\",\n    \"features\": json.dumps(FEATURES),\n    \"type_map\": json.dumps(TYPE_MAP),\n    \"variant\": chosen,\n    \"run_id\": best[\"run_id\"],\n    \"git_sha\": GIT_SHA,\n    \"val_f1\": f\"{best['metrics']['val_f1']:.4f}\",\n    \"test_pr_auc\": f\"{best['metrics']['test_pr_auc']:.4f}\",\n}\nfor k, v in tags.items():\n    client.set_model_version_tag(REGISTERED_MODEL_NAME, mv.version, k, v)\nclient.set_registered_model_alias(REGISTERED_MODEL_NAME, MODEL_ALIAS, mv.version)\nprint(f\"Terdaftar: models:/{REGISTERED_MODEL_NAME}@{MODEL_ALIAS} -> version {mv.version}\")\n\n[sel 27 markdown]\n# ## 9. Inference 1 data baru (dari MLflow Registry)\n# \n# Model dimuat dari registry lewat alias, persis seperti yang dilakukan FastAPI di produksi: bukan dari file lokal. Threshold dan daftar fitur diambil dari tag model version.\n# \n# Data di bawah dirancang agar **seharusnya gagal** menurut aturan dataset: tipe L dengan `tool wear x torque` = 215 x 55 = 11.825, di atas ambang 11.000 (overstrain). Suhu dan daya masih normal, jadi ini menguji apakah model menangkap aturan overstrain, bukan sekadar menebak.\n\n[sel 28 kode]\nnew_sample = {\n    \"type\": \"L\",\n    \"air_temp_k\": 300.5,\n    \"process_temp_k\": 310.9,\n    \"rpm\": 1500,\n    \"torque_nm\": 55.0,\n    \"tool_wear_min\": 215,\n}\n\nmodel_uri = f\"models:/{REGISTERED_MODEL_NAME}@{MODEL_ALIAS}\"\nloaded = mlflow.xgboost.load_model(model_uri)\nmv_loaded = client.get_model_version_by_alias(REGISTERED_MODEL_NAME, MODEL_ALIAS)\nfeats = json.loads(mv_loaded.tags[\"features\"])\nthr = float(mv_loaded.tags[\"threshold\"])\n\nnew_df = pd.DataFrame([new_sample])\nnew_X = make_features(new_df)[feats]\n\nproba = float(loaded.predict_proba(new_X)[0, 1])\npred = int(proba >= thr)\n\nprint(\"Model               :\", model_uri, f\"(version {mv_loaded.version})\")\nprint(new_X.T)\nprint(f\"\\nProbabilitas failure: {proba:.3f}\")\nprint(f\"Threshold           : {thr:.3f}\")\nprint(\"Prediksi            :\", \"FAILURE\" if pred else \"NORMAL\")\nprint(\"Ekspektasi aturan   : FAILURE (overstrain, 11.825 > 11.000 untuk tipe L)\")\n\n[sel 29 markdown]\n# ## Catatan untuk laporan\n# \n# - Dataset sintetis dan labelnya dibentuk dari aturan ambang, jadi skor tinggi tidak otomatis berarti performa sama di data pabrik nyata. Tulis sebagai keterbatasan.\n# - `RNF` (kegagalan acak 0,1%) tidak bisa diprediksi dari sensor, sehingga recall 100% memang tidak realistis.\n# - Untuk perbandingan, ganti bagian 4 dengan Random Forest dan Logistic Regression lalu bandingkan PR-AUC, recall, dan F1 pada test set yang sama.\n# - Fungsi `make_features` dipakai juga di `serving/app.py`. Kalau rumus fitur diubah di notebook, ubah juga di API (daftar fitur & urutannya sudah otomatis ikut model lewat tag MLflow, tapi rumusnya tidak).\n"}, {"path": "requirements.txt", "size": 261, "lines": 16, "kind": "text", "desc": "Dependensi notebook dan API (dipasang di .venv server).", "content": "# Environment project (notebook + API). Dipasang di .venv server oleh deploy_remote.sh\npandas\nnumpy\nscikit-learn\nxgboost\nimbalanced-learn\nmatplotlib\nmlflow>=3.0\nclickhouse-connect\npapermill\nipykernel\nrequests\nfastapi\nuvicorn[standard]\npydantic>=2\npython-dotenv\n"}, {"path": "runs/.gitkeep", "size": 0, "lines": 0, "kind": "empty", "desc": "Penanda agar folder hasil eksekusi notebook ikut tersimpan di git.", "content": ""}, {"path": "scripts/build_explorer.py", "size": 10597, "lines": 176, "kind": "text", "desc": "Membangun halaman penjelajah file ini.", "content": "#!/usr/bin/env python3\n\"\"\"Bangun ui/project_explorer.html: daftar file project + isinya, satu file HTML mandiri.\nJalankan ulang setiap kali file project berubah:  python scripts/build_explorer.py\nFile data besar (csv/sql) hanya ditampilkan metadatanya, bukan isinya.\"\"\"\nimport json\nfrom pathlib import Path\n\nROOT = Path(__file__).resolve().parent.parent\nOUT = ROOT / \"ui\" / \"project_explorer.html\"\nSKIP_DIRS = {\".git\", \"__pycache__\", \".venv\", \"node_modules\", \".ipynb_checkpoints\"}\nSKIP_FILES = {\"ui/project_explorer.html\"}\nDATA_HIDDEN = {\".csv\", \".sql\"}\n\nDESC = {\n \"README.md\": \"Panduan setup, alur pipeline, endpoint API, dan daftar GitHub secrets.\",\n \".env.example\": \"Template konfigurasi server. Salin menjadi .env, jangan di-commit.\",\n \".gitignore\": \"Daftar file yang tidak ikut git.\",\n \"requirements.txt\": \"Dependensi notebook dan API (dipasang di .venv server).\",\n \".github/workflows/mlops-pipeline.yml\": \"CI/CD: SSH ke server, trigger DAG, jalankan notebook, reload API.\",\n \"dags/oracle_to_clickhouse_ai4i.py\": \"DAG Airflow: Oracle 26ai ke ClickHouse, full refresh dengan validasi.\",\n \"dags/requirements-airflow.txt\": \"Dependensi untuk environment Airflow.\",\n \"data/ai4i2020.csv\": \"Data sumber AI4I 2020. Isi tidak ditampilkan di halaman ini.\",\n \"ecosystem.config.js\": \"Konfigurasi pm2 untuk menjalankan uvicorn.\",\n \"notebooks/SMOTE_ai4i2020_xgboost_machine_failure.ipynb\": \"Training baseline + SMOTE, log ke MLflow, daftar ke Registry. Ditampilkan sebagai teks per sel.\",\n \"runs/.gitkeep\": \"Penanda agar folder hasil eksekusi notebook ikut tersimpan di git.\",\n \"scripts/build_explorer.py\": \"Membangun halaman penjelajah file ini.\",\n \"scripts/csv_to_oracle_insert.py\": \"Convert CSV menjadi script INSERT Oracle 26ai.\",\n \"scripts/deploy_remote.sh\": \"Dijalankan di server oleh workflow: update, DAG, notebook, reload.\",\n \"scripts/trigger_airflow_dag.py\": \"Trigger DAG lewat REST API dan tunggu sampai selesai.\",\n \"serving/app.py\": \"FastAPI. Model dimuat dari MLflow Model Registry, bukan file.\",\n \"sql/insert_ai4i2020.sql\": \"Hasil generate INSERT untuk Oracle. Isi tidak ditampilkan di halaman ini.\",\n \"ui/dummy_dashboard.html\": \"Contoh tampilan form prediksi.\",\n \"ui/pipeline_monitor.html\": \"Contoh tampilan status pipeline dan model registry.\",\n}\n\ndef notebook_text(path: Path) -> str:\n    nb = json.loads(path.read_text(encoding=\"utf-8\"))\n    parts = []\n    for i, c in enumerate(nb[\"cells\"], 1):\n        body = \"\".join(c[\"source\"]).rstrip(\"\\n\")\n        if c[\"cell_type\"] == \"markdown\":\n            parts.append(f\"[sel {i} markdown]\\n\" + \"\\n\".join(\"# \" + l for l in body.split(\"\\n\")))\n        else:\n            parts.append(f\"[sel {i} kode]\\n{body}\")\n    return \"\\n\\n\".join(parts) + \"\\n\"\n\nfiles = []\nfor p in sorted(ROOT.rglob(\"*\")):\n    rel = p.relative_to(ROOT).as_posix()\n    if not p.is_file() or rel in SKIP_FILES or p.suffix == \".zip\":\n        continue\n    if any(part in SKIP_DIRS for part in p.relative_to(ROOT).parts):\n        continue\n    if rel.startswith(\"runs/executed_\"):\n        continue\n    size = p.stat().st_size\n    if p.suffix in DATA_HIDDEN:\n        lines = sum(1 for _ in p.open(\"rb\"))\n        files.append(dict(path=rel, size=size, lines=lines, kind=\"data\", desc=DESC.get(rel, \"\"), content=\"\"))\n        continue\n    text = notebook_text(p) if p.suffix == \".ipynb\" else p.read_text(encoding=\"utf-8\")\n    files.append(dict(path=rel, size=size, lines=len(text.splitlines()), kind=\"text\" if text else \"empty\",\n                      desc=DESC.get(rel, \"\"), content=text))\n\nTEMPLATE = r'''\u003c!DOCTYPE html>\n\u003chtml lang=\"id\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\u003ctitle>Penjelajah file project (dummy)\u003c/title>\n\u003clink rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n\u003clink href=\"https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&family=JetBrains+Mono:wght@400;600&display=swap\" rel=\"stylesheet\">\n\u003cstyle>\n:root{--bg:#eef1ee;--panel:#fff;--ink:#16262b;--muted:#5b6b70;--line:#cbd4d1;--sel:#dde7e3;--code:#f6f8f6;--accent:#1f7a5a;\n  --sans:\"Archivo\",system-ui,-apple-system,\"Segoe UI\",sans-serif;--mono:\"JetBrains Mono\",ui-monospace,Menlo,Consolas,monospace;color-scheme:light}\n@media (prefers-color-scheme:dark){:root{--bg:#111a1d;--panel:#182327;--ink:#e6eeeb;--muted:#9aaba9;--line:#2b3a3e;--sel:#233236;--code:#131d20;--accent:#4dbf96;color-scheme:dark}}\n*{box-sizing:border-box}\nbody{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--sans)}\n.wrap{max-width:1240px;margin:0 auto;padding:22px 20px 40px}\nheader{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:10px;border-bottom:2px solid var(--ink);padding-bottom:12px}\nh1{margin:0;font-size:24px;font-weight:800;letter-spacing:-.01em}\n.stats{font:400 12px var(--mono);color:var(--muted)}\n.layout{display:grid;grid-template-columns:320px 1fr;gap:18px;margin-top:18px;align-items:start}\n@media (max-width:860px){.layout{grid-template-columns:1fr}}\n.side,.view{background:var(--panel);border:1px solid var(--line);border-radius:6px}\n.side{padding:12px;max-height:78vh;overflow:auto}\n#q{width:100%;padding:8px 10px;margin-bottom:10px;font:400 14px var(--mono);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:4px}\n#q:focus-visible,.file:focus-visible,summary:focus-visible,#copy:focus-visible{outline:2px solid var(--ink);outline-offset:1px}\ndetails{margin-left:2px} details>div,details>.kids{margin-left:14px;border-left:1px solid var(--line);padding-left:6px}\nsummary{cursor:pointer;padding:3px 4px;font-weight:600;font-size:14px;list-style-position:inside}\n.file{display:block;width:100%;text-align:left;background:none;border:0;border-radius:3px;padding:3px 6px;cursor:pointer;font:400 13px var(--mono);color:var(--ink)}\n.file:hover{background:var(--sel)} .file[aria-current=\"true\"]{background:var(--sel);box-shadow:inset 3px 0 var(--accent);font-weight:600}\n.file[hidden],details[hidden]{display:none}\n.view{min-width:0}\n.vhead{padding:14px 18px;border-bottom:1px solid var(--line)}\n.vhead h2{margin:0;font:600 15px var(--mono);word-break:break-all}\n.vhead p{margin:4px 0 0;color:var(--muted);font-size:14px}\n.meta{display:flex;flex-wrap:wrap;gap:14px;align-items:center;margin-top:8px;font:400 12px var(--mono);color:var(--muted)}\n#copy{font:600 12px var(--sans);padding:4px 10px;border:1px solid var(--line);border-radius:4px;background:transparent;color:var(--ink);cursor:pointer}\n#copy:hover{border-color:var(--ink)}\npre{margin:0;padding:14px 0;background:var(--code);overflow:auto;max-height:70vh;font:400 12.5px/1.55 var(--mono);counter-reset:l;border-radius:0 0 6px 6px}\n.l{display:block;padding:0 18px 0 0;white-space:pre}\n.l::before{counter-increment:l;content:counter(l);display:inline-block;width:3.6em;padding-right:1em;text-align:right;color:var(--muted);user-select:none}\n.empty{padding:28px 18px;color:var(--muted)}\n.note{margin:14px 2px 0;font-size:12px;color:var(--muted)}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv class=\"wrap\">\n  \u003cheader>\n    \u003ch1>machine-failure-mlops\u003c/h1>\n    \u003cdiv class=\"stats\" id=\"stats\">\u003c/div>\n  \u003c/header>\n  \u003cdiv class=\"layout\">\n    \u003cnav class=\"side\" aria-label=\"Daftar file\">\n      \u003cinput id=\"q\" type=\"search\" placeholder=\"Cari nama file\" aria-label=\"Cari nama file\">\n      \u003cdiv id=\"tree\">\u003c/div>\n    \u003c/nav>\n    \u003cmain class=\"view\" id=\"view\" aria-live=\"polite\">\u003c/main>\n  \u003c/div>\n  \u003cp class=\"note\">Tampilan contoh. Daftar dan isi file di halaman ini sudah tertanam saat dibangun (scripts/build_explorer.py), tidak membaca server atau repo.\u003c/p>\n\u003c/div>\n\u003cscript>\nconst FILES = /*__DATA__*/[];\nconst $ = id => document.getElementById(id);\nconst esc = s => s.replace(/&/g,\"&amp;\").replace(/\u003c/g,\"&lt;\").replace(/>/g,\"&gt;\");\nconst kb = n => n \u003c 1024 ? n + \" B\" : (n/1024).toFixed(1).replace(\".\", \",\") + \" KB\";\n\nconst root = {};\nFILES.forEach((f, i) => {\n  let n = root; const parts = f.path.split(\"/\");\n  parts.forEach((p, k) => { if (k === parts.length-1) (n.__f = n.__f || []).push({name:p, i}); else n = (n[p] = n[p] || {}); });\n});\nfunction render(node){\n  const dirs = Object.keys(node).filter(k => k !== \"__f\").sort();\n  let h = dirs.map(d => `\u003cdetails open>\u003csummary>${esc(d)}/\u003c/summary>\u003cdiv>${render(node[d])}\u003c/div>\u003c/details>`).join(\"\");\n  h += (node.__f || []).sort((a,b) => a.name.localeCompare(b.name))\n        .map(f => `\u003cbutton class=\"file\" data-i=\"${f.i}\" data-n=\"${esc(FILES[f.i].path.toLowerCase())}\">${esc(f.name)}\u003c/button>`).join(\"\");\n  return h;\n}\n$(\"tree\").innerHTML = render(root);\n\nconst totalLines = FILES.filter(f => f.kind === \"text\").reduce((a,f) => a + f.lines, 0);\n$(\"stats\").textContent = FILES.length + \" file, \" + new Intl.NumberFormat(\"id-ID\").format(totalLines) + \" baris kode dan teks\";\n\nlet current = null;\nfunction show(i){\n  const f = FILES[i]; current = f;\n  document.querySelectorAll(\".file\").forEach(b => b.setAttribute(\"aria-current\", b.dataset.i == i ? \"true\" : \"false\"));\n  let body;\n  if (f.kind === \"data\") body = `\u003cdiv class=\"empty\">File data (${new Intl.NumberFormat(\"id-ID\").format(f.lines)} baris). Isinya tidak ditampilkan di halaman ini.\u003c/div>`;\n  else if (f.kind === \"empty\") body = `\u003cdiv class=\"empty\">File kosong.\u003c/div>`;\n  else body = \"\u003cpre>\u003ccode>\" + f.content.replace(/\\n$/, \"\").split(\"\\n\").map(l => `\u003cspan class=\"l\">${esc(l) || \" \"}\u003c/span>`).join(\"\") + \"\u003c/code>\u003c/pre>\";\n  $(\"view\").innerHTML = `\u003cdiv class=\"vhead\">\u003ch2>${esc(f.path)}\u003c/h2>\u003cp>${esc(f.desc)}\u003c/p>\n    \u003cdiv class=\"meta\">\u003cspan>${kb(f.size)}\u003c/span>\u003cspan>${f.lines} baris\u003c/span>${f.kind === \"text\" ? '\u003cbutton id=\"copy\" type=\"button\">Salin isi\u003c/button>' : \"\"}\u003c/div>\u003c/div>${body}`;\n  const c = $(\"copy\");\n  if (c) c.onclick = async () => { try { await navigator.clipboard.writeText(current.content); c.textContent = \"Tersalin\"; }\n                                   catch(e) { c.textContent = \"Tidak bisa menyalin\"; } setTimeout(() => c.textContent = \"Salin isi\", 1500); };\n}\ndocument.querySelectorAll(\".file\").forEach(b => b.onclick = () => show(+b.dataset.i));\n\n$(\"q\").oninput = e => {\n  const q = e.target.value.trim().toLowerCase();\n  document.querySelectorAll(\".file\").forEach(b => b.hidden = q && !b.dataset.n.includes(q));\n  document.querySelectorAll(\"details\").forEach(d => d.hidden = q && !d.querySelector(\".file:not([hidden])\"));\n};\nconst start = FILES.findIndex(f => f.path === \"README.md\");\nshow(start >= 0 ? start : 0);\n\u003c/script>\n\u003c/body>\n\u003c/html>\n'''\n\ndata = json.dumps(files, ensure_ascii=False).replace(\"\u003c\", \"\\\\u003c\")  # aman di dalam \u003cscript>\nOUT.write_text(TEMPLATE.replace(\"/*__DATA__*/[]\", data), encoding=\"utf-8\")\nprint(f\"OK: {len(files)} file -> {OUT.relative_to(ROOT)} ({OUT.stat().st_size // 1024} KB)\")\n"}, {"path": "scripts/csv_to_oracle_insert.py", "size": 4266, "lines": 113, "kind": "text", "desc": "Convert CSV menjadi script INSERT Oracle 26ai.", "content": "#!/usr/bin/env python3\n\"\"\"\nConvert ai4i2020.csv -> file .sql berisi INSERT INTO untuk Oracle 26ai (23ai+).\n\nScript ini HANYA menghasilkan file SQL. DDL (CREATE TABLE) dan eksekusi insert\ndikerjakan manual. Nama kolom tujuan (urutan = urutan kolom CSV):\n\n    UDI, PRODUCT_ID, TYPE, AIR_TEMP_K, PROCESS_TEMP_K, RPM, TORQUE_NM,\n    TOOL_WEAR_MIN, MACHINE_FAILURE, TWF, HDF, PWF, OSF, RNF\n\nContoh:\n    python scripts/csv_to_oracle_insert.py \\\n        --csv data/ai4i2020.csv --out sql/insert_ai4i2020.sql \\\n        --table AI4I_2020 --schema MYSCHEMA\n\nStyle output:\n    multirow (default) : INSERT INTO t (cols) VALUES (...),(...);  -> Oracle 23ai/26ai,\n                         maksimal 1000 baris per statement.\n    single             : satu INSERT per baris (paling kompatibel, paling lambat).\n\"\"\"\nimport argparse\nimport csv\nimport re\nimport sys\nfrom pathlib import Path\n\n# (nama kolom Oracle, tipe) sesuai urutan kolom CSV.\nCOLUMNS = [\n    (\"UDI\", \"int\"), (\"PRODUCT_ID\", \"str\"), (\"TYPE\", \"str\"),\n    (\"AIR_TEMP_K\", \"float\"), (\"PROCESS_TEMP_K\", \"float\"), (\"RPM\", \"int\"),\n    (\"TORQUE_NM\", \"float\"), (\"TOOL_WEAR_MIN\", \"int\"), (\"MACHINE_FAILURE\", \"int\"),\n    (\"TWF\", \"int\"), (\"HDF\", \"int\"), (\"PWF\", \"int\"), (\"OSF\", \"int\"), (\"RNF\", \"int\"),\n]\nIDENT = re.compile(r\"^[A-Za-z][A-Za-z0-9_$#]*(\\.[A-Za-z][A-Za-z0-9_$#]*)?$\")\n\n\ndef literal(raw: str, kind: str) -> str:\n    raw = raw.strip()\n    if raw == \"\":\n        return \"NULL\"\n    if kind == \"int\":\n        return str(int(raw))\n    if kind == \"float\":\n        float(raw)  # validasi saja; teks asli dipertahankan agar presisi tidak berubah\n        return raw\n    return \"'\" + raw.replace(\"'\", \"''\") + \"'\"\n\n\ndef main() -> int:\n    ap = argparse.ArgumentParser(description=__doc__, formatter_class=argparse.RawDescriptionHelpFormatter)\n    ap.add_argument(\"--csv\", default=\"data/ai4i2020.csv\")\n    ap.add_argument(\"--out\", default=\"sql/insert_ai4i2020.sql\")\n    ap.add_argument(\"--table\", default=\"AI4I_2020\")\n    ap.add_argument(\"--schema\", default=None, help=\"prefix schema, opsional\")\n    ap.add_argument(\"--batch-size\", type=int, default=500, help=\"baris per INSERT (maks 1000)\")\n    ap.add_argument(\"--style\", choices=[\"multirow\", \"single\"], default=\"multirow\")\n    args = ap.parse_args()\n\n    if not 1 \u003c= args.batch_size \u003c= 1000:\n        sys.exit(\"--batch-size harus 1..1000 (batas Oracle untuk multi-row VALUES)\")\n    target = f\"{args.schema}.{args.table}\" if args.schema else args.table\n    if not IDENT.match(target):\n        sys.exit(f\"Nama tabel tidak valid: {target}\")\n\n    col_list = \", \".join(c for c, _ in COLUMNS)\n    head = f\"INSERT INTO {target} ({col_list}) VALUES\"\n    batch = 1 if args.style == \"single\" else args.batch_size\n\n    Path(args.out).parent.mkdir(parents=True, exist_ok=True)\n    total = 0\n    with open(args.csv, newline=\"\", encoding=\"utf-8-sig\") as fin, \\\n         open(args.out, \"w\", encoding=\"utf-8\", newline=\"\\n\") as fout:\n        reader = csv.reader(fin)\n        header = next(reader)\n        if len(header) != len(COLUMNS):\n            sys.exit(f\"CSV punya {len(header)} kolom, diharapkan {len(COLUMNS)}\")\n\n        fout.write(f\"-- Generated by csv_to_oracle_insert.py dari {Path(args.csv).name}\\n\")\n        fout.write(f\"-- Target: {target} | style: {args.style}\\n\\n\")\n\n        buf = []\n\n        def flush():\n            if not buf:\n                return\n            if args.style == \"single\":\n                fout.write(f\"{head} {buf[0]};\\n\")\n            else:\n                fout.write(head + \"\\n  \" + \",\\n  \".join(buf) + \";\\n\\n\")\n            buf.clear()\n\n        for lineno, row in enumerate(reader, start=2):\n            if not row:\n                continue\n            if len(row) != len(COLUMNS):\n                sys.exit(f\"Baris {lineno}: jumlah kolom {len(row)} != {len(COLUMNS)}\")\n            try:\n                vals = [literal(v, k) for v, (_, k) in zip(row, COLUMNS)]\n            except ValueError as e:\n                sys.exit(f\"Baris {lineno}: nilai tidak valid ({e})\")\n            buf.append(\"(\" + \", \".join(vals) + \")\")\n            total += 1\n            if len(buf) >= batch:\n                flush()\n        flush()\n        fout.write(\"COMMIT;\\n\")\n\n    print(f\"OK: {total} baris -> {args.out}\")\n    return 0\n\n\nif __name__ == \"__main__\":\n    raise SystemExit(main())\n"}, {"path": "scripts/deploy_remote.sh", "size": 2122, "lines": 57, "kind": "text", "desc": "Dijalankan di server oleh workflow: update, DAG, notebook, reload.", "content": "#!/usr/bin/env bash\n# Dijalankan DI SERVER lewat SSH oleh GitHub Actions.\n# Urutan: update kode -> install dependency -> sync DAG -> trigger DAG (API)\n#         -> jalankan notebook (train + log ke MLflow) -> reload FastAPI (pm2)\nset -euo pipefail\n\nAPP_DIR=\"$(cd \"$(dirname \"${BASH_SOURCE[0]}\")/..\" && pwd)\"\ncd \"$APP_DIR\"\n\nstep() { echo; echo \"==> $*\"; }\n\n# Konfigurasi server (kredensial Airflow, MLflow, ClickHouse) ada di .env, bukan di GitHub\nif [[ -f .env ]]; then set -a; source .env; set +a; else echo \"WARNING: .env tidak ditemukan\"; fi\n\nGIT_REF=\"${GIT_REF:-main}\"\nexport GIT_SHA=\"${GIT_SHA:-$(git rev-parse HEAD)}\"\nVENV=\"${VENV_DIR:-$APP_DIR/.venv}\"\n\nstep \"1/6 Update kode ($GIT_REF @ ${GIT_SHA:0:7})\"\ngit fetch --prune origin\ngit checkout -q \"$GIT_REF\"\ngit reset --hard \"$GIT_SHA\"\n\nstep \"2/6 Install dependency\"\n[[ -d \"$VENV\" ]] || python3 -m venv \"$VENV\"\n\"$VENV/bin/pip\" install -q --upgrade pip\n\"$VENV/bin/pip\" install -q -r requirements.txt\n\"$VENV/bin/python\" -m ipykernel install --user --name mlops-venv >/dev/null\n\nstep \"3/6 Sync DAG ke Airflow ($AIRFLOW_DAGS_DIR)\"\n: \"${AIRFLOW_DAGS_DIR:?isi AIRFLOW_DAGS_DIR di .env}\"\ncp -f dags/*.py \"$AIRFLOW_DAGS_DIR/\"\n\nstep \"4/6 Trigger DAG via Airflow API\"\n\"$VENV/bin/python\" scripts/trigger_airflow_dag.py\n\nstep \"5/6 Jalankan notebook (training + log ke MLflow)\"\nmkdir -p runs\nOUT=\"runs/executed_$(date +%Y%m%d_%H%M%S).ipynb\"\n\"$VENV/bin/papermill\" notebooks/SMOTE_ai4i2020_xgboost_machine_failure.ipynb \"$OUT\" \\\n    --cwd notebooks --kernel mlops-venv --log-output\nls -1t runs/executed_*.ipynb | tail -n +11 | xargs -r rm -f   # simpan 10 terakhir\n\nstep \"6/6 Reload FastAPI via pm2 (model dimuat ulang dari MLflow)\"\npm2 startOrReload ecosystem.config.js --update-env\npm2 save >/dev/null\n\n# Smoke test: pastikan API hidup dan memuat model dari registry\nAPI_PORT=\"${API_PORT:-8000}\"\nfor i in {1..15}; do\n  if curl -fsS \"http://127.0.0.1:${API_PORT}/health\" | grep -q '\"model_loaded\":true'; then\n    echo \"API sehat, model termuat.\"; exit 0\n  fi\n  sleep 2\ndone\necho \"ERROR: API tidak sehat setelah reload\"; pm2 logs ml-failure-api --lines 40 --nostream || true\nexit 1\n"}, {"path": "scripts/trigger_airflow_dag.py", "size": 3023, "lines": 93, "kind": "text", "desc": "Trigger DAG lewat REST API dan tunggu sampai selesai.", "content": "#!/usr/bin/env python3\n\"\"\"\nUnpause + trigger DAG Airflow lewat REST API, lalu tunggu sampai selesai.\nExit code 0 kalau DAG run = success, selain itu 1.\n\nEnv:\n  AIRFLOW_BASE_URL     mis. http://localhost:8080\n  AIRFLOW_API_VERSION  v2 (Airflow 3.x, token JWT)  | v1 (Airflow 2.x, basic auth)\n  AIRFLOW_USERNAME / AIRFLOW_PASSWORD\n  AIRFLOW_API_TOKEN    opsional; kalau diisi dipakai langsung sebagai Bearer\n  AIRFLOW_DAG_ID       default oracle_to_clickhouse_ai4i\n  DAG_WAIT_VISIBLE_S   default 180  (tunggu DAG ter-parse setelah file disalin)\n  DAG_TIMEOUT_S        default 3600\n\"\"\"\nimport os\nimport sys\nimport time\n\nimport requests\n\nBASE = os.environ[\"AIRFLOW_BASE_URL\"].rstrip(\"/\")\nVER = os.getenv(\"AIRFLOW_API_VERSION\", \"v2\")\nDAG_ID = os.getenv(\"AIRFLOW_DAG_ID\", \"oracle_to_clickhouse_ai4i\")\nWAIT_VISIBLE = int(os.getenv(\"DAG_WAIT_VISIBLE_S\", \"180\"))\nTIMEOUT = int(os.getenv(\"DAG_TIMEOUT_S\", \"3600\"))\nAPI = f\"{BASE}/api/{VER}\"\n\ns = requests.Session()\ns.headers[\"Content-Type\"] = \"application/json\"\n\n\ndef auth() -> None:\n    token = os.getenv(\"AIRFLOW_API_TOKEN\")\n    user, pwd = os.getenv(\"AIRFLOW_USERNAME\"), os.getenv(\"AIRFLOW_PASSWORD\")\n    if token:\n        s.headers[\"Authorization\"] = f\"Bearer {token}\"\n    elif VER == \"v2\":  # Airflow 3: tukar user/password -> JWT\n        r = requests.post(f\"{BASE}/auth/token\", json={\"username\": user, \"password\": pwd}, timeout=30)\n        r.raise_for_status()\n        s.headers[\"Authorization\"] = f\"Bearer {r.json()['access_token']}\"\n    else:  # Airflow 2: basic auth\n        s.auth = (user, pwd)\n\n\ndef log(msg: str) -> None:\n    print(f\"[airflow] {msg}\", flush=True)\n\n\ndef main() -> int:\n    auth()\n\n    # 1) tunggu DAG ter-parse\n    deadline = time.time() + WAIT_VISIBLE\n    while True:\n        r = s.get(f\"{API}/dags/{DAG_ID}\", timeout=30)\n        if r.status_code == 200:\n            break\n        if time.time() > deadline:\n            log(f\"DAG {DAG_ID} tidak muncul dalam {WAIT_VISIBLE}s (HTTP {r.status_code}).\")\n            return 1\n        log(\"DAG belum terdeteksi, tunggu 10s...\")\n        time.sleep(10)\n\n    # 2) unpause\n    s.patch(f\"{API}/dags/{DAG_ID}\", params={\"update_mask\": \"is_paused\"},\n            json={\"is_paused\": False}, timeout=30).raise_for_status()\n\n    # 3) trigger\n    body = {\"conf\": {}} if VER == \"v1\" else {\"conf\": {}, \"logical_date\": None}\n    r = s.post(f\"{API}/dags/{DAG_ID}/dagRuns\", json=body, timeout=30)\n    r.raise_for_status()\n    run_id = r.json()[\"dag_run_id\"]\n    log(f\"Triggered {DAG_ID} run_id={run_id}\")\n\n    # 4) polling status\n    deadline = time.time() + TIMEOUT\n    last = None\n    while time.time() \u003c deadline:\n        state = s.get(f\"{API}/dags/{DAG_ID}/dagRuns/{run_id}\", timeout=30).json().get(\"state\")\n        if state != last:\n            log(f\"state = {state}\")\n            last = state\n        if state == \"success\":\n            return 0\n        if state == \"failed\":\n            return 1\n        time.sleep(10)\n    log(\"Timeout menunggu DAG selesai.\")\n    return 1\n\n\nif __name__ == \"__main__\":\n    sys.exit(main())\n"}, {"path": "serving/app.py", "size": 7042, "lines": 191, "kind": "text", "desc": "FastAPI. Model dimuat dari MLflow Model Registry, bukan file.", "content": "\"\"\"\nFastAPI serving untuk prediksi machine failure.\n\nModel TIDAK dibaca dari file lokal: dimuat dari MLflow Model Registry lewat alias\n(default `models:/machine_failure_xgb@champion`). Threshold, daftar fitur, dan\ntype_map ikut dari tag model version, jadi selalu sama dengan saat training.\n\nJalankan (dev):   uvicorn app:app --reload --port 8000     (dari folder serving/)\nProduksi:         pm2 start ecosystem.config.js\n\"\"\"\nimport json\nimport logging\nimport os\nimport secrets\nimport threading\nfrom contextlib import asynccontextmanager\nfrom datetime import datetime, timezone\nfrom pathlib import Path\nfrom typing import Literal\n\nimport mlflow\nimport mlflow.xgboost\nimport pandas as pd\nfrom dotenv import load_dotenv\nfrom fastapi import FastAPI, Header, HTTPException\nfrom fastapi.middleware.cors import CORSMiddleware\nfrom mlflow.tracking import MlflowClient\nfrom pydantic import BaseModel, Field\n\nload_dotenv(Path(__file__).resolve().parent.parent / \".env\")\n\nlog = logging.getLogger(\"uvicorn.error\")\nTRACKING_URI = os.getenv(\"MLFLOW_TRACKING_URI\", \"http://127.0.0.1:5000\")\nMODEL_NAME = os.getenv(\"MLFLOW_MODEL_NAME\", \"machine_failure_xgb\")\nMODEL_ALIAS = os.getenv(\"MLFLOW_MODEL_ALIAS\", \"champion\")\nADMIN_API_KEY = os.getenv(\"ADMIN_API_KEY\", \"\")\nCORS_ORIGINS = [o.strip() for o in os.getenv(\"CORS_ORIGINS\", \"\").split(\",\") if o.strip()]\n\n\n# ----------------------------------------------------------------- feature engineering\n# Harus identik dengan make_features() di notebook.\ndef make_features(d: pd.DataFrame, type_map: dict) -> pd.DataFrame:\n    out = pd.DataFrame(index=d.index)\n    out[\"type_enc\"] = d[\"type\"].map(type_map)\n    out[\"air_temp_k\"] = d[\"air_temp_k\"]\n    out[\"process_temp_k\"] = d[\"process_temp_k\"]\n    out[\"rpm\"] = d[\"rpm\"]\n    out[\"torque_nm\"] = d[\"torque_nm\"]\n    out[\"tool_wear_min\"] = d[\"tool_wear_min\"]\n    out[\"temp_diff_k\"] = d[\"process_temp_k\"] - d[\"air_temp_k\"]\n    out[\"power_w\"] = d[\"torque_nm\"] * d[\"rpm\"] * 2 * 3.141592653589793 / 60\n    out[\"wear_torque\"] = d[\"tool_wear_min\"] * d[\"torque_nm\"]\n    return out\n\n\n# ----------------------------------------------------------------- model store\nclass ModelStore:\n    def __init__(self) -> None:\n        self._lock = threading.Lock()\n        self._state: dict | None = None\n\n    def load(self) -> dict:\n        mlflow.set_tracking_uri(TRACKING_URI)\n        client = MlflowClient()\n        mv = client.get_model_version_by_alias(MODEL_NAME, MODEL_ALIAS)\n        # muat berdasarkan nomor version (bukan alias) supaya model & tag pasti satu paket\n        model = mlflow.xgboost.load_model(f\"models:/{MODEL_NAME}/{mv.version}\")\n        tags = mv.tags\n        state = {\n            \"model\": model,\n            \"version\": str(mv.version),\n            \"features\": json.loads(tags[\"features\"]),\n            \"type_map\": json.loads(tags[\"type_map\"]),\n            \"threshold\": float(tags[\"threshold\"]),\n            \"variant\": tags.get(\"variant\"),\n            \"run_id\": mv.run_id,\n            \"loaded_at\": datetime.now(timezone.utc).isoformat(timespec=\"seconds\"),\n        }\n        with self._lock:\n            self._state = state\n        log.info(\"Model dimuat: %s v%s (%s), threshold=%.3f\",\n                 MODEL_NAME, state[\"version\"], state[\"variant\"], state[\"threshold\"])\n        return state\n\n    def get(self) -> dict:\n        with self._lock:\n            st = self._state\n        if st is None:\n            raise HTTPException(503, \"Model belum termuat dari MLflow. Cek koneksi/registry lalu panggil /reload.\")\n        return st\n\n\nstore = ModelStore()\n\n\n@asynccontextmanager\nasync def lifespan(_: FastAPI):\n    try:\n        store.load()\n    except Exception as e:  # API tetap hidup; /health menunjukkan model_loaded=false\n        log.error(\"Gagal memuat model dari MLflow: %s\", e)\n    yield\n\n\napp = FastAPI(title=\"Machine Failure API\", version=\"1.0.0\", lifespan=lifespan)\nif CORS_ORIGINS:\n    app.add_middleware(CORSMiddleware, allow_origins=CORS_ORIGINS,\n                       allow_methods=[\"GET\", \"POST\"], allow_headers=[\"*\"])\n\n\n# ----------------------------------------------------------------- schema\nclass Reading(BaseModel):\n    type: Literal[\"L\", \"M\", \"H\"] = Field(..., description=\"Kualitas produk\")\n    air_temp_k: float = Field(..., ge=250, le=350, description=\"Suhu udara [K]\")\n    process_temp_k: float = Field(..., ge=250, le=400, description=\"Suhu proses [K]\")\n    rpm: int = Field(..., gt=0, le=10000, description=\"Kecepatan putar [rpm]\")\n    torque_nm: float = Field(..., ge=0, le=200, description=\"Torsi [Nm]\")\n    tool_wear_min: int = Field(..., ge=0, le=1000, description=\"Keausan alat [menit]\")\n\n    model_config = {\"json_schema_extra\": {\"examples\": [{\n        \"type\": \"L\", \"air_temp_k\": 300.5, \"process_temp_k\": 310.9,\n        \"rpm\": 1500, \"torque_nm\": 55.0, \"tool_wear_min\": 215}]}}\n\n\nclass Prediction(BaseModel):\n    prediction: int\n    label: Literal[\"FAILURE\", \"NORMAL\"]\n    probability: float\n    threshold: float\n    model_version: str\n\n\nclass BatchRequest(BaseModel):\n    items: list[Reading] = Field(..., min_length=1, max_length=1000)\n\n\ndef _predict(rows: list[Reading]) -> list[Prediction]:\n    st = store.get()\n    df = pd.DataFrame([r.model_dump() for r in rows])\n    X = make_features(df, st[\"type_map\"])[st[\"features\"]]\n    proba = st[\"model\"].predict_proba(X)[:, 1]\n    return [\n        Prediction(prediction=int(p >= st[\"threshold\"]),\n                   label=\"FAILURE\" if p >= st[\"threshold\"] else \"NORMAL\",\n                   probability=round(float(p), 6), threshold=st[\"threshold\"],\n                   model_version=st[\"version\"])\n        for p in proba\n    ]\n\n\n# ----------------------------------------------------------------- endpoints\n@app.get(\"/health\")\ndef health():\n    try:\n        st = store.get()\n        return {\"status\": \"ok\", \"model_loaded\": True, \"model_version\": st[\"version\"]}\n    except HTTPException:\n        return {\"status\": \"degraded\", \"model_loaded\": False}\n\n\n@app.get(\"/model-info\")\ndef model_info():\n    st = store.get()\n    return {\n        \"name\": MODEL_NAME, \"alias\": MODEL_ALIAS, \"version\": st[\"version\"],\n        \"variant\": st[\"variant\"], \"threshold\": st[\"threshold\"],\n        \"features\": st[\"features\"], \"mlflow_run_id\": st[\"run_id\"],\n        \"loaded_at\": st[\"loaded_at\"], \"tracking_uri\": TRACKING_URI,\n    }\n\n\n@app.post(\"/predict\", response_model=Prediction)\ndef predict(reading: Reading):\n    return _predict([reading])[0]\n\n\n@app.post(\"/predict/batch\", response_model=list[Prediction])\ndef predict_batch(req: BatchRequest):\n    return _predict(req.items)\n\n\n@app.post(\"/reload\")\ndef reload_model(x_api_key: str = Header(default=\"\")):\n    \"\"\"Muat ulang model dari MLflow tanpa restart. Perlu header X-API-Key = ADMIN_API_KEY.\"\"\"\n    if not ADMIN_API_KEY or not secrets.compare_digest(x_api_key, ADMIN_API_KEY):\n        raise HTTPException(403, \"Forbidden\")\n    try:\n        st = store.load()\n    except Exception as e:\n        raise HTTPException(502, f\"Gagal memuat model dari MLflow: {e}\")\n    return {\"status\": \"reloaded\", \"model_version\": st[\"version\"], \"threshold\": st[\"threshold\"]}\n"}, {"path": "sql/insert_ai4i2020.sql", "size": 735099, "lines": 10044, "kind": "data", "desc": "Hasil generate INSERT untuk Oracle. Isi tidak ditampilkan di halaman ini.", "content": ""}, {"path": "ui/dummy_dashboard.html", "size": 9362, "lines": 167, "kind": "text", "desc": "Contoh tampilan form prediksi.", "content": "\u003c!DOCTYPE html>\n\u003chtml lang=\"id\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\u003ctitle>Cek kondisi mesin (dummy)\u003c/title>\n\u003clink rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n\u003clink href=\"https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&family=JetBrains+Mono:wght@400;600&display=swap\" rel=\"stylesheet\">\n\u003cstyle>\n:root{--bg:#eef1ee;--panel:#fff;--ink:#16262b;--muted:#5b6b70;--line:#cbd4d1;--track:#dde4e1;--ok:#1f7a5a;--fail:#c2410c;\n  --sans:\"Archivo\",system-ui,-apple-system,\"Segoe UI\",sans-serif;--mono:\"JetBrains Mono\",ui-monospace,Menlo,Consolas,monospace;color-scheme:light}\n@media (prefers-color-scheme:dark){:root{--bg:#111a1d;--panel:#182327;--ink:#e6eeeb;--muted:#9aaba9;--line:#2b3a3e;--track:#263337;--ok:#4dbf96;--fail:#f08a5d;color-scheme:dark}}\n*{box-sizing:border-box}\nbody{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--sans)}\n.wrap{max-width:1080px;margin:0 auto;padding:24px 20px 48px}\nheader{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px;border-bottom:2px solid var(--ink);padding-bottom:14px}\nh1{margin:0;font-size:26px;font-weight:800;letter-spacing:-.01em}\nh2{margin:0 0 12px;font-size:16px;font-weight:600}\n.chip{font:400 12px/1.4 var(--mono);color:var(--muted);text-align:right}\n.chip b{color:var(--ink);font-weight:600}\n.grid{display:grid;grid-template-columns:340px 1fr;gap:20px;margin-top:20px}\n@media (max-width:820px){.grid{grid-template-columns:1fr}}\n.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:18px}\nlabel{display:block;font-size:13px;color:var(--muted);margin:12px 0 4px}\n.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}\ninput,select{width:100%;padding:8px 10px;font:400 15px var(--mono);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:4px}\ninput:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}\n.presets{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 6px}\nbutton{font:600 14px var(--sans);cursor:pointer;border-radius:4px;padding:9px 14px;border:1px solid var(--ink);background:var(--ink);color:var(--bg)}\nbutton.ghost{background:transparent;color:var(--ink);border-color:var(--line);padding:6px 10px;font-weight:400;font-size:13px}\nbutton.ghost:hover{border-color:var(--ink)}\n.go{width:100%;margin-top:18px}\n.verdict{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}\n.verdict strong{font-size:44px;font-weight:800;line-height:1;letter-spacing:-.02em}\n.verdict span{font:400 14px var(--mono);color:var(--muted)}\n.state-fail strong{color:var(--fail)} .state-ok strong{color:var(--ok)}\n.gauge{position:relative;height:26px;margin:22px 0 6px;background:var(--track);border-radius:3px}\n.gauge .fill{position:absolute;inset:0 auto 0 0;border-radius:3px;background:var(--ok);transition:width .35s ease}\n.state-fail .fill{background:var(--fail)}\n.gauge .tick{position:absolute;top:-8px;bottom:-8px;width:2px;background:var(--ink)}\n.gauge .tick i{position:absolute;top:-20px;left:0;transform:translateX(-50%);font:400 11px var(--mono);font-style:normal;white-space:nowrap}\n.scale{display:flex;justify-content:space-between;font:400 11px var(--mono);color:var(--muted)}\n.meters{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:22px}\n@media (max-width:620px){.meters{grid-template-columns:1fr}}\n.meter small{display:block;color:var(--muted);font-size:12px}\n.meter b{font:600 15px var(--mono)}\n.bar{height:6px;background:var(--track);border-radius:3px;margin-top:6px;overflow:hidden}\n.bar i{display:block;height:100%;background:var(--muted)}\n.bar.hot i{background:var(--fail)}\ntable{width:100%;border-collapse:collapse;font-size:14px}\nth{text-align:left;font-weight:600;color:var(--muted);padding:6px 8px;border-bottom:1px solid var(--line)}\ntd{padding:8px;border-bottom:1px solid var(--line);font-family:var(--mono);font-size:13px}\ntd.f{color:var(--fail);font-weight:600} td.n{color:var(--ok)}\n.note{margin-top:16px;font-size:12px;color:var(--muted)}\n.table-scroll{overflow-x:auto}\n@media (prefers-reduced-motion:reduce){.gauge .fill{transition:none}}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv class=\"wrap\">\n  \u003cheader>\n    \u003ch1>Cek kondisi mesin\u003c/h1>\n    \u003cdiv class=\"chip\">model \u003cb>machine_failure_xgb@champion\u003c/b> versi \u003cb>7\u003c/b>\u003cbr>threshold \u003cb>0,578\u003c/b>, dilatih 19 Okt 2026\u003c/div>\n  \u003c/header>\n\n  \u003cdiv class=\"grid\">\n    \u003csection class=\"panel\" aria-labelledby=\"h-input\">\n      \u003ch2 id=\"h-input\">Pembacaan sensor\u003c/h2>\n      \u003cdiv class=\"presets\">\n        \u003cbutton type=\"button\" class=\"ghost\" data-p=\"safe\">Contoh aman\u003c/button>\n        \u003cbutton type=\"button\" class=\"ghost\" data-p=\"overstrain\">Contoh overstrain\u003c/button>\n        \u003cbutton type=\"button\" class=\"ghost\" data-p=\"heat\">Contoh panas\u003c/button>\n      \u003c/div>\n      \u003clabel for=\"type\">Kualitas produk\u003c/label>\n      \u003cselect id=\"type\">\u003coption>L\u003c/option>\u003coption>M\u003c/option>\u003coption>H\u003c/option>\u003c/select>\n      \u003cdiv class=\"row\">\n        \u003cdiv>\u003clabel for=\"air\">Suhu udara (K)\u003c/label>\u003cinput id=\"air\" type=\"number\" step=\"0.1\">\u003c/div>\n        \u003cdiv>\u003clabel for=\"proc\">Suhu proses (K)\u003c/label>\u003cinput id=\"proc\" type=\"number\" step=\"0.1\">\u003c/div>\n        \u003cdiv>\u003clabel for=\"rpm\">Putaran (rpm)\u003c/label>\u003cinput id=\"rpm\" type=\"number\">\u003c/div>\n        \u003cdiv>\u003clabel for=\"tq\">Torsi (Nm)\u003c/label>\u003cinput id=\"tq\" type=\"number\" step=\"0.1\">\u003c/div>\n      \u003c/div>\n      \u003clabel for=\"wear\">Keausan alat (menit)\u003c/label>\n      \u003cinput id=\"wear\" type=\"number\">\n      \u003cbutton type=\"button\" class=\"go\" id=\"run\">Prediksi\u003c/button>\n    \u003c/section>\n\n    \u003cdiv>\n      \u003csection class=\"panel\" id=\"result\" aria-live=\"polite\">\n        \u003ch2>Hasil prediksi\u003c/h2>\n        \u003cdiv class=\"verdict\">\u003cstrong id=\"label\">-\u003c/strong>\u003cspan id=\"proba\">\u003c/span>\u003c/div>\n        \u003cdiv class=\"gauge\" role=\"img\" aria-label=\"Probabilitas gagal dibanding threshold\">\n          \u003cdiv class=\"fill\" id=\"fill\" style=\"width:0\">\u003c/div>\n          \u003cdiv class=\"tick\" style=\"left:57.8%\">\u003ci>threshold 57,8%\u003c/i>\u003c/div>\n        \u003c/div>\n        \u003cdiv class=\"scale\">\u003cspan>0%\u003c/span>\u003cspan>50%\u003c/span>\u003cspan>100%\u003c/span>\u003c/div>\n\n        \u003cdiv class=\"meters\">\n          \u003cdiv class=\"meter\">\u003csmall>Selisih suhu\u003c/small>\u003cb id=\"m-temp\">\u003c/b>\u003cdiv class=\"bar\" id=\"b-temp\">\u003ci>\u003c/i>\u003c/div>\u003c/div>\n          \u003cdiv class=\"meter\">\u003csmall>Daya\u003c/small>\u003cb id=\"m-pow\">\u003c/b>\u003cdiv class=\"bar\" id=\"b-pow\">\u003ci>\u003c/i>\u003c/div>\u003c/div>\n          \u003cdiv class=\"meter\">\u003csmall>Keausan x torsi (batas 11.000 untuk tipe L)\u003c/small>\u003cb id=\"m-wt\">\u003c/b>\u003cdiv class=\"bar\" id=\"b-wt\">\u003ci>\u003c/i>\u003c/div>\u003c/div>\n        \u003c/div>\n        \u003cp class=\"note\">Tampilan contoh. Angka hasil berasal dari rumus sederhana di halaman ini, belum terhubung ke API atau model.\u003c/p>\n      \u003c/section>\n\n      \u003csection class=\"panel\" style=\"margin-top:20px\">\n        \u003ch2>Prediksi terakhir\u003c/h2>\n        \u003cdiv class=\"table-scroll\">\u003ctable>\n          \u003cthead>\u003ctr>\u003cth>Waktu\u003c/th>\u003cth>Mesin\u003c/th>\u003cth>Tipe\u003c/th>\u003cth>Probabilitas\u003c/th>\u003cth>Hasil\u003c/th>\u003c/tr>\u003c/thead>\n          \u003ctbody>\n            \u003ctr>\u003ctd>10:42\u003c/td>\u003ctd>M14860\u003c/td>\u003ctd>M\u003c/td>\u003ctd>3,1%\u003c/td>\u003ctd class=\"n\">Normal\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>10:37\u003c/td>\u003ctd>L47213\u003c/td>\u003ctd>L\u003c/td>\u003ctd>88,4%\u003c/td>\u003ctd class=\"f\">Gagal\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>10:31\u003c/td>\u003ctd>H29501\u003c/td>\u003ctd>H\u003c/td>\u003ctd>1,7%\u003c/td>\u003ctd class=\"n\">Normal\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>10:12\u003c/td>\u003ctd>L47188\u003c/td>\u003ctd>L\u003c/td>\u003ctd>64,0%\u003c/td>\u003ctd class=\"f\">Gagal\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>09:58\u003c/td>\u003ctd>M15102\u003c/td>\u003ctd>M\u003c/td>\u003ctd>9,5%\u003c/td>\u003ctd class=\"n\">Normal\u003c/td>\u003c/tr>\n          \u003c/tbody>\n        \u003c/table>\u003c/div>\n      \u003c/section>\n    \u003c/div>\n  \u003c/div>\n\u003c/div>\n\n\u003cscript>\nconst THR = 0.578, LIMIT = {L: 11000, M: 12000, H: 13000};\nconst PRESETS = {\n  safe:       {type:\"M\", air:298.1, proc:308.6, rpm:1551, tq:42.8, wear:20},\n  overstrain: {type:\"L\", air:300.5, proc:310.9, rpm:1500, tq:55.0, wear:215},\n  heat:       {type:\"L\", air:302.4, proc:310.5, rpm:1300, tq:46.0, wear:90}\n};\nconst $ = id => document.getElementById(id);\nconst pct = x => (x*100).toFixed(1).replace(\".\", \",\") + \"%\";\nconst num = (x, d=0) => x.toLocaleString(\"id-ID\", {maximumFractionDigits:d});\n\nfunction fill(p){ for (const k in p) $(k).value = p[k]; run(); }\n\nfunction run(){\n  const t=$(\"type\").value, air=+$(\"air\").value, proc=+$(\"proc\").value,\n        rpm=+$(\"rpm\").value, tq=+$(\"tq\").value, wear=+$(\"wear\").value;\n  const dT = proc-air, power = tq*rpm*2*Math.PI/60, wt = wear*tq;\n\n  // probabilitas simulasi, bukan model\n  const risk = Math.max(wt/LIMIT[t], (power\u003c3500||power>9000)?1:0, (dT\u003c8.6&&rpm\u003c1380)?1:0);\n  const p = Math.min(0.97, Math.max(0.01, 1/(1+Math.exp(-(risk-0.95)*9))));\n  const fail = p >= THR;\n\n  $(\"result\").className = \"panel \" + (fail ? \"state-fail\" : \"state-ok\");\n  $(\"label\").textContent = fail ? \"Gagal\" : \"Normal\";\n  $(\"proba\").textContent = \"probabilitas gagal \" + pct(p);\n  $(\"fill\").style.width = pct(p);\n\n  $(\"m-temp\").textContent = num(dT,1)+\" K\";\n  $(\"m-pow\").textContent  = num(power)+\" W\";\n  $(\"m-wt\").textContent   = num(wt);\n  setBar(\"b-temp\", dT/20, dT\u003c8.6 && rpm\u003c1380);\n  setBar(\"b-pow\", power/10000, power\u003c3500||power>9000);\n  setBar(\"b-wt\", wt/LIMIT[t], wt>LIMIT[t]);\n}\nfunction setBar(id, ratio, hot){\n  $(id).className = \"bar\" + (hot ? \" hot\" : \"\");\n  $(id).firstElementChild.st
