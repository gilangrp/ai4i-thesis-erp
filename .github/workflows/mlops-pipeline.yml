name: MLOps CI/CD Pipeline (Test on GitHub Actions)

on:
  push:
    branches: [ main ]
    paths:
      - 'dags/**'
      - 'notebooks/**'
      - 'serving/**'
      - 'scripts/**'
      - 'workflows/**'
      - 'sql/**'
      - 'requirements.txt'
  workflow_dispatch: # Tombol manual "Run workflow" di GitHub UI

jobs:
  test-and-sync:
    name: Run Pipeline on Runner & Sync to VPS
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Python 3.11 di Runner GitHub
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip' # Mempercepat build berikutnya dengan cache

      - name: 3. Setup SSH Key untuk Sync ke VPS
        if: env.SSH_HOST != ''
        env:
          SSH_HOST: ${{ secrets.SSH_HOST || '202.10.42.115' }}
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          SSH_PORT="${{ secrets.SSH_PORT || '22' }}"
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          chmod 644 ~/.ssh/known_hosts

      - name: 4. Jalankan Pipeline (Install Airflow -> Test DAG -> Train Notebook -> Sync VPS)
        env:
          SSH_HOST: ${{ secrets.SSH_HOST || '202.10.42.115' }}
          SSH_USER: ${{ secrets.SSH_USER || 'root' }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          APP_DIR: ${{ secrets.APP_DIR || '/root/ai4i-thesis-erp' }}
          CLICKHOUSE_HOST: ${{ secrets.CLICKHOUSE_HOST || '202.10.42.115' }}
          CLICKHOUSE_PORT: ${{ secrets.CLICKHOUSE_PORT || '8123' }}
          CLICKHOUSE_USER: ${{ secrets.CLICKHOUSE_USER || 'airflow_etl' }}
          CLICKHOUSE_PASSWORD: ${{ secrets.CLICKHOUSE_PASSWORD || 'airflow_etl' }}
          CLICKHOUSE_DB: ${{ secrets.CLICKHOUSE_DB || 'erp_ai4i' }}
          SOURCE_DB_HOST: ${{ secrets.SOURCE_DB_HOST || '202.10.42.115' }}
          SOURCE_DB_PORT: ${{ secrets.SOURCE_DB_PORT || '5432' }}
          SOURCE_DB_USER: ${{ secrets.SOURCE_DB_USER || 'airflow_etl' }}
          SOURCE_DB_PASSWORD: ${{ secrets.SOURCE_DB_PASSWORD || 'airflow_etl' }}
          SOURCE_DB_NAME: ${{ secrets.SOURCE_DB_NAME || 'erp_ai4i' }}
        run: |
          chmod +x workflows/airflow-to-mlflow/deploy_remote.sh
          bash workflows/airflow-to-mlflow/deploy_remote.sh

      - name: 5. Upload Artifact ke GitHub (Bisa diunduh langsung dari browser)
        if: always() # Tetap upload meskipun step sebelumnya ada warning
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-test-results
          path: |
            airflow_home/airflow.db
            mlflow.db
            mlruns/
            runs/*.ipynb
          retention-days: 7
