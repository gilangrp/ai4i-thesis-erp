name: MLOps pipeline (SSH > DAG > notebook > FastAPI)

on:
  push:
    branches: [main]
    paths:
      - "dags/**"
      - "notebooks/**"
      - "serving/**"
      - "scripts/**"
      - "requirements.txt"
      - "ecosystem.config.js"
      - ".github/workflows/**"
  workflow_dispatch:

# satu pipeline pada satu waktu; run berikutnya antre, tidak membatalkan yang sedang jalan
concurrency:
  group: mlops-pipeline
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
      APP_DIR: ${{ secrets.APP_DIR }}
    steps:
      - name: Siapkan kredensial SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          if [ -n "$SSH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -p "${SSH_PORT:-22}" -H "$SSH_HOST" >> ~/.ssh/known_hosts
          fi

      - name: Jalankan pipeline di server
        # Di server: git update > pip install > copy DAG > trigger DAG via API (tunggu sukses)
        #            > papermill notebook (log ke MLflow) > pm2 reload FastAPI > health check
        run: |
          ssh -i ~/.ssh/id_deploy -p "${SSH_PORT:-22}" \
              -o ServerAliveInterval=30 -o ServerAliveCountMax=40 \
              "$SSH_USER@$SSH_HOST" \
              "set -e; cd '$APP_DIR'; git fetch --prune origin; git reset --hard '$GITHUB_SHA'; \
               GIT_REF='$GITHUB_REF_NAME' GIT_SHA='$GITHUB_SHA' bash scripts/deploy_remote.sh"

      - name: Bersihkan kredensial
        if: always()
        run: rm -f ~/.ssh/id_deploy
